   WGSL — シェーダ
   ========================================================================== */

// --- 全画面三角形 + 共通の定義 ---
const WGSL_COMMON = `
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };

@vertex fn vsFull(@builtin(vertex_index) vi: u32) -> VO {
  var P = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VO;
  o.pos = vec4f(P[vi], 0.0, 1.0);
  o.uv  = P[vi]*0.5 + vec2f(0.5, 0.5);
  return o;
}

// キューブマップの面番号と uv から方向を得る（+X -X +Y -Y +Z -Z）
fn dirFromFace(face: u32, uv: vec2f) -> vec3f {
  let a = uv.x*2.0 - 1.0;
  let b = uv.y*2.0 - 1.0;
  switch (face) {
    case 0u: { return normalize(vec3f( 1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b,  a)); }
    case 2u: { return normalize(vec3f( a,  1.0,  b)); }
    case 3u: { return normalize(vec3f( a, -1.0, -b)); }
    case 4u: { return normalize(vec3f( a, -b,  1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}
`;

// --- 全パイプラインで共通のユニフォーム ---
const WGSL_UNI = `
struct Uni {
  view     : mat4x4f, // 世界 -> ビュー
  proj     : mat4x4f, // ビュー -> クリップ
  viewProj : mat4x4f, // 世界 -> クリップ（w が視線方向の深度になる）
  camRight : vec4f,   // xyz = カメラ右, w = tan(縦画角/2)
  camUp    : vec4f,   // xyz = カメラ上, w = アスペクト比
  camFwd   : vec4f,   // xyz = カメラ前
  camPos   : vec4f,   // xyz = カメラ位置, w = 時刻
  grav     : vec4f,   // xyz = 重力の逆向き
  liqA     : vec4f,   // rgb = 液体に残る色, a = 吸収の強さ
  glsA     : vec4f,   // rgb = ガラスに残る色, a = 吸収の強さ
  mat      : vec4f,   // x = ガラス屈折率, y = 液体屈折率, z = ガラス粗さ, w = 露出
  res      : vec4f,   // xy = 解像度, zw = 1/解像度
  bnd      : vec4f,   // x = 境界円筒の半径, y = 同 半高, z = ミップ最大, w = 背景の明るさ
  fluid    : vec4f,   // x = 粒子の表示半径, y = 厚み係数, z = 平滑化半径(流体画素), w = 遠方値
  fres     : vec4f,   // xy = 流体バッファの解像度, zw = その逆数
};
@group(0) @binding(0) var<uniform> U: Uni;
`;

// --- 環境マップの手続き生成 ---
const WGSL_ENVGEN = WGSL_COMMON + `
struct EnvU { face: u32, preset: u32, lobe: f32, pad: f32 };
@group(0) @binding(0) var<uniform> E: EnvU;

// 原点から見たソフトボックス（矩形の面光源）のマスク
fn softbox(d: vec3f, C: vec3f, hu: f32, hv: f32, soft: f32) -> f32 {
  let n  = normalize(-C);
  let dn = dot(d, n);
  if (dn > -1e-4) { return 0.0; }
  let t = dot(C, n)/dn;
  if (t <= 0.0) { return 0.0; }
  let w = d*t - C;
  var u = cross(n, vec3f(0.0, 1.0, 0.0));
  if (length(u) < 1e-3) { u = cross(n, vec3f(1.0, 0.0, 0.0)); }
  u = normalize(u);
  let v = normalize(cross(u, n));
  let a = abs(dot(w, u));
  let b = abs(dot(w, v));
  let ma = 1.0 - smoothstep(hu*(1.0 - soft), hu, a);
  let mb = 1.0 - smoothstep(hv*(1.0 - soft), hv, b);
  return ma*mb;
}

// 床（高さ -1.55 の面）。真下に柔らかい影を落とす。
fn floorCol(d: vec3f, near: vec3f, far: vec3f, shadow: f32) -> vec3f {
  let t = -1.12/d.y;
  let p = d*t;
  let r = length(p.xz);
  var fl = mix(near, far, smoothstep(0.35, 5.0, r));
  fl *= mix(shadow, 1.0, smoothstep(0.15, 1.05, r));
  return fl;
}

// --- 景色 ---
//   容器が画面の大半を覆うので、見えているものはほぼ「容器ごしの環境マップ」になる。
//   なめらかなグラデーションだけだと屈折させても変化が見えないので、
//   輪郭の硬い光源・細い縦のストリップ・床と壁の境目を入れる。
//   細いストリップは屈折すると線として曲がるので、液面や泡の形が一番よく分かる。

fn envStudio(d: vec3f) -> vec3f {
  // 背景の壁（上へ向かって暗く）
  var c = mix(vec3f(0.058, 0.065, 0.082), vec3f(0.014, 0.016, 0.022),
              smoothstep(0.0, 0.8, d.y));

  // 床。壁との境目ははっきり出す。
  if (d.y < -0.004) {
    let t = -1.12/d.y;
    let p = d*t;
    let r = length(p.xz);
    var fl = mix(vec3f(0.125, 0.132, 0.148), vec3f(0.011, 0.013, 0.018),
                 smoothstep(0.35, 4.2, r));
    fl *= mix(0.10, 1.0, smoothstep(0.10, 0.90, r));      // 接地の影
    c = mix(c, fl, smoothstep(-0.004, -0.018, d.y));      // 境目を硬く
  }

  c += softbox(d, vec3f(-2.3,  2.6,  2.0), 1.55, 1.15, 0.05) * vec3f(8.5, 8.6, 9.0);
  c += softbox(d, vec3f( 2.9,  0.7,  1.9), 0.11, 1.70, 0.10) * vec3f(7.0, 7.2, 8.0);
  c += softbox(d, vec3f( 2.2, -0.5, -2.2), 0.09, 1.30, 0.12) * vec3f(3.2, 3.3, 3.9);
  c += softbox(d, vec3f(-2.6, -0.2, -1.6), 0.08, 1.10, 0.12) * vec3f(2.2, 2.3, 2.8);
  c += softbox(d, vec3f(-0.4,  0.8, -3.2), 2.40, 2.00, 0.12) * vec3f(0.30, 0.32, 0.38);
  return c;
}

fn envRoom(d: vec3f) -> vec3f {
  var c = mix(vec3f(0.095, 0.086, 0.074), vec3f(0.022, 0.020, 0.018),
              smoothstep(0.0, 0.8, d.y));
  if (d.y < -0.004) {
    let t = -1.12/d.y;
    let p = d*t;
    let r = length(p.xz);
    var fl = mix(vec3f(0.165, 0.118, 0.078), vec3f(0.018, 0.013, 0.010),
                 smoothstep(0.35, 4.2, r));
    fl *= mix(0.10, 1.0, smoothstep(0.10, 0.90, r));
    c = mix(c, fl, smoothstep(-0.004, -0.018, d.y));
  }
  // 窓（桟で3枚に割る。屈折すると縦線が曲がって見える）
  c += softbox(d, vec3f(-2.9, 1.3, 1.9), 0.26, 1.55, 0.03) * vec3f(6.5, 7.0, 8.4);
  c += softbox(d, vec3f(-2.9, 1.3, 0.1), 0.26, 1.55, 0.03) * vec3f(6.5, 7.0, 8.4);
  // 室内灯（暖色）
  c += softbox(d, vec3f( 0.8, 3.1, -0.6), 0.45, 0.45, 0.10) * vec3f(5.5, 4.2, 2.7);
  c += softbox(d, vec3f( 2.6, 0.2, -1.8), 0.08, 1.00, 0.06) * vec3f(2.0, 1.7, 1.3);
  return c;
}

fn envSunset(d: vec3f) -> vec3f {
  let h = clamp(d.y, -1.0, 1.0);
  var c = mix(vec3f(0.46, 0.21, 0.13), vec3f(0.035, 0.045, 0.100),
              smoothstep(-0.02, 0.70, h));
  // 水平線をはっきり出す
  c = mix(c, vec3f(0.78, 0.40, 0.20), smoothstep(0.06, 0.0, abs(h))*0.85);
  if (d.y < -0.004) {
    let t = -1.12/d.y;
    let p = d*t;
    let r = length(p.xz);
    var fl = mix(vec3f(0.115, 0.078, 0.058), vec3f(0.016, 0.013, 0.016),
                 smoothstep(0.35, 4.2, r));
    fl *= mix(0.12, 1.0, smoothstep(0.10, 0.90, r));
    c = mix(c, fl, smoothstep(-0.004, -0.018, d.y));
  }
  // 低い太陽（輪郭を硬く）
  let sun = normalize(vec3f(-0.72, 0.10, 0.68));
  let ca  = dot(d, sun);
  c += vec3f(20.0, 9.0, 3.6) * smoothstep(0.9988, 0.9994, ca);
  c += vec3f(0.85, 0.36, 0.16) * pow(max(ca, 0.0), 40.0);
  c += softbox(d, vec3f( 2.6, 0.6, -1.9), 0.09, 1.20, 0.05) * vec3f(1.6, 1.2, 1.0);
  return c;
}

@fragment fn fsEnv(i: VO) -> @location(0) vec4f {
  let d = dirFromFace(E.face, i.uv);
  var c: vec3f;
  switch (E.preset) {
    case 1u:  { c = envRoom(d); }
    case 2u:  { c = envSunset(d); }
    default:  { c = envStudio(d); }
  }
  return vec4f(c, 1.0);
}
`;

// --- 環境マップのプリフィルタ（ラフネス反射用のミップ） ---
const WGSL_ENVBLUR = WGSL_COMMON + `
struct EnvU { face: u32, preset: u32, lobe: f32, pad: f32 };
@group(0) @binding(0) var<uniform> E: EnvU;
@group(0) @binding(1) var srcTex: texture_cube<f32>;
@group(0) @binding(2) var smp: sampler;

@fragment fn fsBlur(i: VO) -> @location(0) vec4f {
  let n = dirFromFace(E.face, i.uv);
  var t = cross(n, vec3f(0.0, 1.0, 0.0));
  if (length(t) < 1e-3) { t = cross(n, vec3f(1.0, 0.0, 0.0)); }
  t = normalize(t);
  let b = cross(n, t);

  var acc = vec3f(0.0);
  var wsum = 0.0;
  const N = 28;
  for (var k = 0; k < N; k++) {
    let fk = (f32(k) + 0.5)/f32(N);
    let r  = sqrt(fk)*E.lobe;
    let a  = f32(k)*2.39996323;
    let dir = normalize(n + (t*cos(a) + b*sin(a))*tan(min(r, 1.45)));
    let w = cos(r);
    acc  += textureSampleLevel(srcTex, smp, dir, 0.0).rgb * w;
    wsum += w;
  }
  return vec4f(acc/max(wsum, 1e-5), 1.0);
}
`;

// --- 本体: ガラス・空気・液体を統一的に扱うレイマーチャ ---
//
//   3つの媒質（ガラス / 空洞の空気 / 液体）を符号付き距離関数で表し、
//   界面に当たるたびにフレネルで反射と屈折に分け、
//   媒質の中を進んだ距離に応じて Beer-Lambert で吸収をかける。
//   反射側は環境キューブマップで打ち切る（単体のオブジェでは十分）。
//   全反射のときは同じ媒質の中で反射させてそのまま追跡を続ける。
//
function buildMainWGSL(shape){
  const shapeSrc = buildShapeSource(shape, 'wgsl');
  const M = CONFIG.march;
  return WGSL_COMMON + `
${WGSL_UNI}
@group(0) @binding(1) var envTex: texture_cube<f32>;
@group(0) @binding(2) var smp: sampler;
@group(0) @binding(3) var liqDepth: texture_2d<f32>;
@group(0) @binding(4) var liqThick: texture_2d<f32>;
@group(0) @binding(5) var gasDepth: texture_2d<f32>;
@group(0) @binding(6) var gasThick: texture_2d<f32>;

const EPS   : f32 = ${f(M.eps)};
const NEPS  : f32 = ${f(M.normalEps)};
const SEGMAX: f32 = 9.0;
const MARCH : i32 = ${M.cavity};
const MAXSEG: i32 = 6;

const MED_OUT   : i32 = 0;
const MED_GLASS : i32 = 1;
const MED_AIR   : i32 = 2;
const MED_LIQ   : i32 = 3;

${SDF_LIB_WGSL}
${shapeSrc}

// --- 液体は画面空間で表す ---
// 粒子を球として描いた深度（前面）と厚みから、液体を「深度方向のスラブ」とみなす。
// 視線から少しずれたレイでも、投影しなおして同じ表を引けるので、
// 屈折したレイの追跡をそのまま続けられる。
fn projUV(p: vec3f) -> vec3f {           // xy = uv(y上), z = ビュー深度
  let c = U.viewProj*vec4f(p, 1.0);
  if (c.w <= 1e-6) { return vec3f(-1.0, -1.0, -1.0); }
  return vec3f(c.xy/c.w*0.5 + vec2f(0.5, 0.5), c.w);
}
fn texel(uv: vec2f) -> vec2i {
  let r = U.fres.xy;
  return vec2i(clamp(vec2f(uv.x, 1.0 - uv.y)*r, vec2f(0.0), r - vec2f(1.0)));
}
// 相ごとの「前面の深度」と「厚み」。厚みは半解像度で線形に読むので段差が出ない。
fn liqAtUV(uv: vec2f) -> vec2f {
  return vec2f(textureLoad(liqDepth, texel(uv), 0).r,
               textureSampleLevel(liqThick, smp, vec2f(uv.x, 1.0 - uv.y), 0.0).r);
}
fn gasAtUV(uv: vec2f) -> vec2f {
  return vec2f(textureLoad(gasDepth, texel(uv), 0).r,
               textureSampleLevel(gasThick, smp, vec2f(uv.x, 1.0 - uv.y), 0.0).r);
}
// 視線方向の距離なので、斜めの面で踏み越えないよう安全側に縮める。
// zb を渡すことで、スラブの奥側を手前の相の手前で打ち切れる。
fn slabDist(zf: f32, zb: f32, z: f32) -> f32 {
  return max(zf - z, z - zb)*0.45;
}

fn viewPosAt(uv: vec2f, z: f32) -> vec3f {
  let ndc = uv*2.0 - vec2f(1.0, 1.0);
  return vec3f(ndc.x*U.camRight.w*U.camUp.w*z, ndc.y*U.camRight.w*z, -z);
}
fn toWorldN(n: vec3f) -> vec3f {
  return normalize(U.camRight.xyz*n.x + U.camUp.xyz*n.y - U.camFwd.xyz*n.z);
}
// 深度の差分から面の法線を起こす。前後どちらか近いほうの差分を採って輪郭を保つ。
fn normalFromDepth(q: vec3f, isGas: bool) -> vec3f {
  // 1画素の差分だと粒ひとつぶんの膨らみがそのまま法線に出て、
  // つながった液体ではなく玉の集まりに見えてしまう。
  // 粒の見かけの大きさに合わせて差分の幅を広げ、面として均す。
  let e = U.fres.zw*max(U.fluid.z*0.60, 2.0);
  var z   = 0.0; var zx1 = 0.0; var zx0 = 0.0; var zy1 = 0.0; var zy0 = 0.0;
  if (isGas) {
    z   = gasAtUV(q.xy).x;
    zx1 = gasAtUV(q.xy + vec2f(e.x, 0.0)).x;
    zx0 = gasAtUV(q.xy - vec2f(e.x, 0.0)).x;
    zy1 = gasAtUV(q.xy + vec2f(0.0, e.y)).x;
    zy0 = gasAtUV(q.xy - vec2f(0.0, e.y)).x;
  } else {
    z   = liqAtUV(q.xy).x;
    zx1 = liqAtUV(q.xy + vec2f(e.x, 0.0)).x;
    zx0 = liqAtUV(q.xy - vec2f(e.x, 0.0)).x;
    zy1 = liqAtUV(q.xy + vec2f(0.0, e.y)).x;
    zy0 = liqAtUV(q.xy - vec2f(0.0, e.y)).x;
  }
  let P  = viewPosAt(q.xy, z);
  var dx = viewPosAt(q.xy + vec2f(e.x, 0.0), zx1) - P;
  if (abs(zx0 - z) < abs(zx1 - z)) { dx = P - viewPosAt(q.xy - vec2f(e.x, 0.0), zx0); }
  var dy = viewPosAt(q.xy + vec2f(0.0, e.y), zy1) - P;
  if (abs(zy0 - z) < abs(zy1 - z)) { dy = P - viewPosAt(q.xy - vec2f(0.0, e.y), zy0); }
  var n = cross(dx, dy);
  let l = length(n);
  if (l < 1e-12) { return -U.camFwd.xyz; }
  n = n/l;
  if (n.z < 0.0) { n = -n; }
  return toWorldN(n);
}

// body = 容器, liq = 液体（空気をくり抜いたもの）, cav = 空洞,
// liqS = 液体のスラブ, gasS = 空気のスラブ
struct FD { body: f32, liq: f32, cav: f32, liqS: f32, gasS: f32 };

fn fields(p: vec3f) -> FD {
  var f: FD;
  let o = sdOuter(p);
  let c = sdCavity(p);
  f.cav  = c;
  f.body = max(o, -c);
  // 空洞の外に中身はないので、重い画面空間の判定を省く
  if (c > 0.0) { f.liqS = 1.0; f.gasS = 1.0; f.liq = c; return f; }

  let q = projUV(p);
  var liqS = 1.0;
  var gasS = 1.0;
  if (q.x >= 0.0 && q.x <= 1.0 && q.y >= 0.0 && q.y <= 1.0) {
    let L = liqAtUV(q.xy);
    let G = gasAtUV(q.xy);
    let hasL = L.x < U.fluid.w*0.5;
    let hasG = G.x < U.fluid.w*0.5;
    // 薄いところでも最低限の奥行きを持たせる（薄すぎると点滅する）
    let tmin = U.fluid.x*1.8;
    if (hasL) { liqS = slabDist(L.x, L.x + max(L.y, tmin), q.z); }
    if (hasG) {
      var zb = G.x + max(G.y, tmin);
      // 気体より奥から液体が始まるなら、気体はそこで終わる。
      // ここを打ち切らないと、気体の中を落ちる細い筋が気体に覆い隠されて
      // 見えなくなる（液体がワープして見える原因）。
      if (hasL && L.x > G.x) { zb = min(zb, L.x); }
      gasS = slabDist(G.x, zb, q.z);
    }
  }
  f.liqS = liqS;
  f.gasS = gasS;
  // 液体 = 空洞 ∩ 液体スラブ ∩ ¬空気スラブ
  f.liq  = max(max(c, liqS), -gasS);
  return f;
}
fn ifaceDist(p: vec3f) -> f32 {
  let f = fields(p);
  return min(abs(f.body), abs(f.liq));
}
fn mediumOf(f: FD) -> i32 {
  if (f.body < 0.0) { return MED_GLASS; }
  if (f.cav  < 0.0) {
    if (f.liq < 0.0) { return MED_LIQ; }
    return MED_AIR;
  }
  return MED_OUT;
}
fn mediumAt(p: vec3f) -> i32 { return mediumOf(fields(p)); }
fn iorOf(m: i32) -> f32 {
  if (m == MED_GLASS) { return U.mat.x; }
  if (m == MED_LIQ)   { return U.mat.y; }
  return 1.0;
}

// 4点法による勾配
fn gradBody(p: vec3f) -> vec3f {
  let e = NEPS;
  let d1 = sdBody(p + vec3f( e, -e, -e));
  let d2 = sdBody(p + vec3f(-e, -e,  e));
  let d3 = sdBody(p + vec3f(-e,  e, -e));
  let d4 = sdBody(p + vec3f( e,  e,  e));
  return normalize(vec3f(d4 + d1 - d2 - d3, d4 - d1 - d2 + d3, d4 - d1 + d2 - d3));
}
fn gradCav(p: vec3f) -> vec3f {
  let e = NEPS;
  let d1 = sdCavity(p + vec3f( e, -e, -e));
  let d2 = sdCavity(p + vec3f(-e, -e,  e));
  let d3 = sdCavity(p + vec3f(-e,  e, -e));
  let d4 = sdCavity(p + vec3f( e,  e,  e));
  return normalize(vec3f(d4 + d1 - d2 - d3, d4 - d1 - d2 + d3, d4 - d1 + d2 - d3));
}

fn envS(d: vec3f, mip: f32) -> vec3f {
  return textureSampleLevel(envTex, smp, d, clamp(mip, 0.0, U.bnd.z)).rgb;
}

// 直接見える背景。照明用の環境マップとは別に作る。
// 環境マップは反射と透過のために明るくしておき、背景だけを落ち着いた暗さにすると、
// 暗い背景の中でオブジェだけが光を通して見える（撮影スタジオと同じ考え方）。
fn bgColor(d: vec3f) -> vec3f {
  let h = clamp(d.y*0.5 + 0.5, 0.0, 1.0);
  var c = mix(vec3f(0.017, 0.020, 0.027), vec3f(0.052, 0.059, 0.076), smoothstep(0.28, 1.0, h));
  if (d.y < -0.004) {
    let t = -1.12/d.y;
    let p = d*t;
    let r = length(p.xz);
    var fl = mix(vec3f(0.082, 0.088, 0.100), vec3f(0.014, 0.016, 0.022), smoothstep(0.35, 5.0, r));
    fl *= mix(0.14, 1.0, smoothstep(0.13, 1.05, r));    // 接地の影
    c = mix(c, fl, smoothstep(-0.004, -0.055, d.y));
  }
  return c;
}
fn f0of(n1: f32, n2: f32) -> f32 { let r = (n1 - n2)/(n1 + n2); return r*r; }
fn fres(f0: f32, c: f32) -> f32 {
  let m = clamp(1.0 - c, 0.0, 1.0);
  return f0 + (1.0 - f0)*pow(m, 5.0);
}

// 軸が y の円筒との交差。見つからなければ x に負値。
fn hitCyl(ro: vec3f, rd: vec3f, R: f32, H: f32) -> vec2f {
  var t0 = -1e9;
  var t1 =  1e9;
  let a = dot(rd.xz, rd.xz);
  let b = dot(ro.xz, rd.xz);
  let c = dot(ro.xz, ro.xz) - R*R;
  if (a > 1e-9) {
    let disc = b*b - a*c;
    if (disc < 0.0) { return vec2f(-1.0, -1.0); }
    let s = sqrt(disc);
    t0 = (-b - s)/a;
    t1 = (-b + s)/a;
  } else if (c > 0.0) {
    return vec2f(-1.0, -1.0);
  }
  if (abs(rd.y) > 1e-9) {
    let ta = (-H - ro.y)/rd.y;
    let tb = ( H - ro.y)/rd.y;
    t0 = max(t0, min(ta, tb));
    t1 = min(t1, max(ta, tb));
  } else if (abs(ro.y) > H) {
    return vec2f(-1.0, -1.0);
  }
  if (t1 < max(t0, 0.0)) { return vec2f(-1.0, -1.0); }
  return vec2f(max(t0, 0.0), t1);
}

@fragment fn fsMain(i: VO) -> @location(0) vec4f {
  // 確認用: 相を色分けして見る（?view=phase）。屈折を通さないので物理だけを見られる。
  if (U.camFwd.w > 0.5) {
    let L = liqAtUV(i.uv);
    let G = gasAtUV(i.uv);
    // 厚みを足し合わせるので、液体の中にある泡も見える
    var tl = select(0.0, min(L.y*1.9, 1.3), L.x < U.fluid.w*0.5);
    var tg = select(0.0, min(G.y*1.9, 1.3), G.x < U.fluid.w*0.5);
    if (U.camFwd.w > 2.5) { tg = 0.0; }        // 液相だけ
    else if (U.camFwd.w > 1.5) { tl = 0.0; }   // 気相だけ
    let c = vec3f(0.015, 0.018, 0.028)
          + vec3f(0.07, 0.33, 0.95)*tl
          + vec3f(1.00, 0.46, 0.06)*tg;
    return vec4f(c, 1.0);
  }

  let ndc = i.uv*2.0 - vec2f(1.0, 1.0);
  let rd0 = normalize(U.camFwd.xyz
          + U.camRight.xyz*(ndc.x*U.camRight.w*U.camUp.w)
          + U.camUp.xyz   *(ndc.y*U.camRight.w));
  let ro  = U.camPos.xyz;

  let hb = hitCyl(ro, rd0, U.bnd.x, U.bnd.y);
  if (hb.x < 0.0) {
    return vec4f(bgColor(rd0)*U.bnd.w, 1.0);
  }

  var pos = ro + rd0*max(hb.x - 0.004, 0.0);
  var dir = rd0;
  var med = mediumAt(pos);
  var thr = vec3f(1.0, 1.0, 1.0);
  var rad = vec3f(0.0, 0.0, 0.0);
  var settled = false;
  // すれすれの角度で屈折したレイは大きく広がる。そのぶん環境マップを
  // ぼかして拾わないと、細い光源を拾って壁ぎわがギラつく。
  var spread = 0.0;

  let gExt = U.glsA.a*(vec3f(1.0, 1.0, 1.0) - U.glsA.rgb);
  let lExt = U.liqA.a*(vec3f(1.0, 1.0, 1.0) - U.liqA.rgb);

  for (var seg = 0; seg < MAXSEG; seg++) {
    // --- 今いる媒質の中を、次の界面まで進む ---
    var t = 0.0;
    var hit = false;
    for (var s = 0; s < MARCH; s++) {
      let d = ifaceDist(pos + dir*t);
      if (d < EPS) { hit = true; break; }
      t += max(d, EPS*0.8);
      if (t > SEGMAX) { break; }
    }
    if (med == MED_GLASS)    { thr *= exp(-gExt*t); }
    else if (med == MED_LIQ) { thr *= exp(-lExt*t); }

    if (!hit) {
      if (med == MED_OUT) { rad += thr*bgColor(dir)*U.bnd.w; }
      else                { rad += thr*envS(dir, spread*U.bnd.z); }
      settled = true;
      break;
    }
    pos = pos + dir*t;

    // --- 界面の法線（ガラス面か液面か、近いほうを採る） ---
    // liq = max(cav, liqS, -gasS) のうち、どの面が効いているかで法線を選ぶ
    let f = fields(pos);
    var nrm: vec3f;
    if (abs(f.body) <= abs(f.liq)) {
      nrm = gradBody(pos);                              // 容器の内壁
    } else if (f.cav > -U.fluid.x*1.6) {
      // 壁のすぐそばは必ず壁の法線を使う。画素ごとに壁と液面の法線が
      // 切り替わると、壁ぎわに縦縞が出てしまう。
      nrm = gradCav(pos);
    } else if (-f.gasS >= f.liqS) {
      nrm = normalFromDepth(projUV(pos), true);         // 泡の面
    } else {
      nrm = normalFromDepth(projUV(pos), false);        // 液体の自由表面
    }
    if (dot(nrm, dir) > 0.0) { nrm = -nrm; }

    let medNext = mediumAt(pos + dir*(EPS*4.0));
    if (medNext == med) {
      // 界面をかすめただけ。少し進めて続行する
      pos = pos + dir*(EPS*4.0);
      continue;
    }

    let n1   = iorOf(med);
    let n2   = iorOf(medNext);
    let cosi = max(dot(-dir, nrm), 0.0);
    let eta  = n1/n2;
    let kk   = 1.0 - eta*eta*(1.0 - cosi*cosi);

    if (kk < 0.0) {
      // 全反射。同じ媒質の中で反射して追跡を続ける
      dir = reflect(dir, nrm);
      pos = pos + dir*(EPS*4.0);
      continue;
    }

    let rough = select(0.0, U.mat.z, med == MED_GLASS || medNext == MED_GLASS);
    let F = fres(f0of(n1, n2), cosi);
    rad += thr*F*envS(reflect(dir, nrm), max(rough*1.6, spread*0.6)*U.bnd.z);
    thr *= (1.0 - F);
    // 入射が浅いほどレイは広がる
    spread = min(spread + (1.0 - cosi)*0.55, 1.0);

    dir = normalize(eta*dir + (eta*cosi - sqrt(kk))*nrm);
    pos = pos + dir*(EPS*4.0);
    med = medNext;

    if (med == MED_OUT) {
      // 物体を抜けて背景へ。透過光は明るい環境マップから拾う
      rad += thr*envS(dir, spread*U.bnd.z);
      settled = true;
      break;
    }
    if (max(thr.r, max(thr.g, thr.b)) < 0.004) { settled = true; break; }
  }
  if (!settled) { rad += thr*envS(dir, max(spread, 0.3)*U.bnd.z)*0.7; }
  return vec4f(rad, 1.0);
}
`;
}

// --- トーンマップ ---
const WGSL_POST = WGSL_COMMON + `
` + WGSL_UNI + `
@group(0) @binding(1) var hdrTex: texture_2d<f32>;
@group(0) @binding(2) var smp: sampler;

fn aces(x: vec3f) -> vec3f {
  let a = 2.51; let b = 0.03; let c = 2.43; let d = 0.59; let e = 0.14;
  return clamp((x*(a*x + vec3f(b)))/(x*(c*x + vec3f(d)) + vec3f(e)), vec3f(0.0), vec3f(1.0));
}

@fragment fn fsPost(i: VO) -> @location(0) vec4f {
  var c = textureSampleLevel(hdrTex, smp, vec2f(i.uv.x, 1.0 - i.uv.y), 0.0).rgb;
  c = aces(c*U.mat.w);
  let q = (i.uv - vec2f(0.5, 0.5))*vec2f(U.camUp.w, 1.0);
  c *= 1.0 - 0.20*dot(q, q);
  c = pow(max(c, vec3f(0.0)), vec3f(1.0/2.2));
  let n = fract(sin(dot(i.pos.xy, vec2f(12.9898, 78.233)))*43758.5453);
  c += vec3f((n - 0.5)/255.0);
  return vec4f(c, 1.0);
}
`;

// --- 粒子を球として描く（液面の深度と厚み） ---
const WGSL_PART = WGSL_COMMON + WGSL_UNI + `
@group(0) @binding(1) var<storage, read> parts: array<vec4f>;

struct PO {
  @builtin(position) pos : vec4f,
  @location(0)       uv  : vec2f,   // 球の断面上の位置 (-1..1)
  @location(1)       vc  : vec3f,   // ビュー空間の中心
};

@vertex fn vsPart(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> PO {
  var Q = array<vec2f, 6>(
    vec2f(-1.0, -1.0), vec2f( 1.0, -1.0), vec2f(-1.0,  1.0),
    vec2f(-1.0,  1.0), vec2f( 1.0, -1.0), vec2f( 1.0,  1.0));
  let q  = Q[vi];
  let r  = U.fluid.x;
  let vc = (U.view*vec4f(parts[ii].xyz, 1.0)).xyz;
  var o: PO;
  o.pos = U.proj*vec4f(vc + vec3f(q*r, 0.0), 1.0);
  o.uv  = q;
  o.vc  = vc;
  return o;
}

struct DO { @location(0) d: f32, @builtin(frag_depth) z: f32 };

@fragment fn fsPartDepth(i: PO) -> DO {
  let d2 = dot(i.uv, i.uv);
  if (d2 > 1.0) { discard; }
  let r  = U.fluid.x;
  let vp = i.vc + vec3f(i.uv*r, sqrt(1.0 - d2)*r);
  let c  = U.proj*vec4f(vp, 1.0);
  var o: DO;
  o.d = -vp.z;
  o.z = c.z/c.w;
  return o;
}

@fragment fn fsPartThick(i: PO) -> @location(0) f32 {
  let d2 = dot(i.uv, i.uv);
  if (d2 > 1.0) { discard; }
  return 2.0*U.fluid.x*sqrt(1.0 - d2)*U.fluid.y;
}
`;

// --- 深度の平滑化（分離2パスの双方向フィルタ）---
//   球のつぶつぶを消して滑らかな液面にする。深度が大きく離れた画素は
//   重みを落とすので、輪郭がぼやけて溶けることはない。
const WGSL_SMOOTH = WGSL_COMMON + WGSL_UNI + `
@group(0) @binding(1) var src: texture_2d<f32>;

// narrow-range filter（Truong ら）
//   中心の深度から一定の幅の外に出たサンプルは「捨てる」のではなく「端に丸める」。
//   捨てると縁で重みが偏って輪郭が溶けるが、丸めると平均が端に寄るだけなので
//   粒のでこぼこだけ消えて輪郭は立ったまま残る。
fn smoothDir(fc: vec2f, dir: vec2i) -> f32 {
  let res = vec2i(U.fres.xy);
  let t0  = vec2i(floor(fc));
  let z0  = textureLoad(src, t0, 0).r;
  if (z0 > U.fluid.w*0.5) { return z0; }

  let R   = i32(U.fluid.z);
  let sg  = max(f32(R)*0.45, 1.0);
  // 手前側は狭く、奥側は広く取る（手前の輪郭を鈍らせない）
  let thr = max(U.fluid.x*4.2, 1e-4);
  let lo  = z0 - thr*0.55;
  let hi  = z0 + thr;

  var sum  = z0;
  var wsum = 1.0;
  for (var k = 1; k <= R; k++) {
    let w = exp(-f32(k*k)/(2.0*sg*sg));
    for (var sgn = -1; sgn <= 1; sgn += 2) {
      let t = t0 + dir*(k*sgn);
      if (t.x < 0 || t.y < 0 || t.x >= res.x || t.y >= res.y) { continue; }
      let zs = textureLoad(src, t, 0).r;
      // 液体のない画素は「奥にある液体」ではないので、平均に入れてはいけない。
      // 入れると、細い筋や縁がまとめて奥へ押しやられて消えてしまう
      // （落ちる紐が見えない／壁ぎわに隙間ができる／面が震える、の原因）。
      if (zs > U.fluid.w*0.5) { continue; }
      sum  += clamp(zs, lo, hi)*w;
      wsum += w;
    }
  }
  return sum/wsum;
}

@fragment fn fsSmoothX(i: VO) -> @location(0) f32 { return smoothDir(i.pos.xy, vec2i(1, 0)); }
@fragment fn fsSmoothY(i: VO) -> @location(0) f32 { return smoothDir(i.pos.xy, vec2i(0, 1)); }
`;

// --- 描画に使う位置を時間方向にならす ---
//   ソルバの1ステップごとの細かい揺れがそのまま見えると、粒が振動して見える。
//   描画用に少し遅れて追従する位置を別に持ち、そちらを描く。
//   大きく飛んだとき（やり直し・反転の直後）は追従させる。
const WGSL_RPOS = `
struct RP { p: vec4f };          // x = 追従率, y = 粒子数, z = 追いつく距離
@group(0) @binding(0) var<uniform> P: RP;
@group(0) @binding(1) var<storage, read>       src: array<vec4f>;
@group(0) @binding(2) var<storage, read_write> dst: array<vec4f>;

@compute @workgroup_size(64)
fn csRenderPos(@builtin(global_invocation_id) gid: vec3u) {
  let i = gid.x;
  if (i >= u32(P.p.y)) { return; }
  let a = src[i].xyz;
  let b = dst[i].xyz;
  let d = a - b;
  let k = select(P.p.x, 1.0, dot(d, d) > P.p.z*P.p.z);
  dst[i] = vec4f(b + d*k, 0.0);
}
`;

/* ==========================================================================
   SIM — 二相流体ソルバ（WebGPU の計算シェーダ）
   ========================================================================== */

const FAR = 1.0e5;

const Sim = {
  ready: false,
  N: 0, nLiquid: 0, nGas: 0,
  spacing: 0, h: 0, rho0: 1, cells: 0, dims: [0,0,0], origin: [0,0,0],

  init(dev){
    const C = CONFIG.sim;
    const seed = seedParticles(C.particles);
    this.N       = seed.count;
    this.nLiquid = seed.nLiquid;
    this.nGas    = seed.count - seed.nLiquid;
    this.spacing = seed.spacing;
    this.h       = C.hFactor*seed.spacing;
    this.rho0    = latticeDensity(seed.spacing, this.h);   // 質量1のときの格子密度

    // 近傍グリッド（空洞を包む箱を1セルぶん広げる）
    const cb = SHAPE.cavityBound, cell = this.h;
    this.origin = [-cb.r - cell, -cb.h - cell, -cb.r - cell];
    this.dims = [
      Math.ceil((2*cb.r + 2*cell)/cell) + 1,
      Math.ceil((2*cb.h + 2*cell)/cell) + 1,
      Math.ceil((2*cb.r + 2*cell)/cell) + 1,
    ];
    this.cells = this.dims[0]*this.dims[1]*this.dims[2];

    const mk = (size) => dev.createBuffer({
      size: Math.max(16, size),
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
    });
    this.bufPos = mk(this.N*16);
    this.bufVel = mk(this.N*16);
    this.bufCur = mk(this.N*16);
    this.bufNxt = mk(this.N*16);
    this.bufLam = mk(this.N*4);
    this.bufCnt = mk(this.cells*4);
    this.bufItm = mk(this.cells*C.cellCap*4);
    // 描画用（時間方向にならした位置）。空気を格子で持つときは、後ろに泡を描く球を置く
    this.grid = GRID_AIR();
    if (this.grid) { this.gridDims(); this.nGas = this.nCells; }
    this.bufRender = mk((this.N + (this.grid ? this.nCells : 0))*16);
    this.bufStat = dev.createBuffer({ size: 32,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    this.ub     = dev.createBuffer({ size: 176, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.stage = [0, 1].map(() => ({
      buf: dev.createBuffer({ size: 32, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }),
      busy: false,
    }));
    this.stats = new Uint32Array(8);

    dev.queue.writeBuffer(this.bufPos, 0, seed.positions);
    dev.queue.writeBuffer(this.bufRender, 0, seed.positions);
    dev.queue.writeBuffer(this.bufVel, 0, new Float32Array(this.N*4));

    // --- パイプライン ---
    const st = GPUShaderStage.COMPUTE;
    const ent = [{ binding: 0, visibility: st, buffer: { type: 'uniform' } }];
    for (let b = 1; b <= 8; b++) ent.push({ binding: b, visibility: st, buffer: { type: 'storage' } });
    const bgl = dev.createBindGroupLayout({ entries: ent });
    const layout = dev.createPipelineLayout({ bindGroupLayouts: [bgl] });
    const mod = dev.createShaderModule({ code: buildSimWGSL(SHAPE, C.cellCap), label: 'sim' });

    const bg = (a, b) => dev.createBindGroup({ layout: bgl, entries: [
      { binding: 0, resource: { buffer: this.ub } },
      { binding: 1, resource: { buffer: this.bufPos } },
      { binding: 2, resource: { buffer: this.bufVel } },
      { binding: 3, resource: { buffer: a } },
      { binding: 4, resource: { buffer: b } },
      { binding: 5, resource: { buffer: this.bufLam } },
      { binding: 6, resource: { buffer: this.bufCnt } },
      { binding: 7, resource: { buffer: this.bufItm } },
      { binding: 8, resource: { buffer: this.bufStat } },
    ]});
    this.bg = [bg(this.bufCur, this.bufNxt), bg(this.bufNxt, this.bufCur)];

    const pipe = (name) => dev.createComputePipeline({
      layout, compute: { module: mod, entryPoint: name }, label: name,
    });
    this.p = {
      predict : pipe('csPredict'),
      clear   : pipe('csClear'),
      build   : pipe('csBuild'),
      lambda  : pipe('csLambda'),
      delta   : pipe('csDelta'),
      final   : pipe('csFinal'),
      visc    : pipe('csVisc'),
      applyV  : pipe('csApplyVel'),
      statCl  : pipe('csStatsClear'),
      stat    : pipe('csStats'),
    };

    // 描画用の位置をならすパイプライン（必要なのは2本だけなので別レイアウト）
    const rbgl = dev.createBindGroupLayout({ entries: [
      { binding: 0, visibility: st, buffer: { type: 'uniform' } },
      { binding: 1, visibility: st, buffer: { type: 'read-only-storage' } },
      { binding: 2, visibility: st, buffer: { type: 'storage' } },
    ]});
    this.rub = dev.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.pRender = dev.createComputePipeline({
      layout: dev.createPipelineLayout({ bindGroupLayouts: [rbgl] }),
      compute: { module: dev.createShaderModule({ code: WGSL_RPOS, label: 'rpos' }), entryPoint: 'csRenderPos' },
    });
    this.bgRender = dev.createBindGroup({ layout: rbgl, entries: [
      { binding: 0, resource: { buffer: this.rub } },
      { binding: 1, resource: { buffer: this.bufPos } },
      { binding: 2, resource: { buffer: this.bufRender } },
    ]});
    dev.queue.writeBuffer(this.rub, 0, new Float32Array([
      CONFIG.sim.renderFollow, this.N, this.spacing*6, 0]));

    this.spData = new Float32Array(44);
    this.spU32  = new Uint32Array(this.spData.buffer);
    if (this.grid) this.initGrid(dev, mk);
    this.ready  = true;
  },

  // 空気の圧力格子（CONFIG.sim.air = 'grid' のとき）
  // 格子の寸法。描画用の位置の配列に空気の球のぶんを足すので、バッファより先に決める
  gridDims(){
    const C = CONFIG.sim, cb = SHAPE.cavityBound, s = this.spacing;
    const hc = C.gridCell*s, hf = Math.min(C.gridFine, C.gridCell)*s;
    const O = SHAPE.orifice.p, rh = SHAPE.orifice.r;
    // 軸ごとに「粗い・細かい・粗い」。細かい帯は穴を中心に、x と z は穴の半径の bandXZ 倍、
    // y は仕切りの厚みに穴の半径の bandY 倍を足した範囲
    const axis = (lo, hi, c, w) => {
      const nf = Math.max(0, Math.ceil(2*w/hf));
      const x0 = c - 0.5*nf*hf, x1 = c + 0.5*nf*hf;
      const nL = Math.max(1, Math.ceil((x0 - lo)/hc));
      const nR = Math.max(1, Math.ceil((hi - x1)/hc));
      return { lo: x0 - nL*hc, nL, nf, n: nL + nf + nR };
    };
    const wxz = hf < hc ? rh*C.fineBandXZ : 0;
    const wy  = hf < hc ? SHAPE.plateHalf + rh*C.fineBandY : 0;
    this.gax = [
      axis(-cb.r - hc, cb.r + hc, O[0], wxz),
      axis(-cb.h - hc, cb.h + hc, O[1], wy),
      axis(-cb.r - hc, cb.r + hc, O[2], wxz),
    ];
    this.gdx   = hc;
    this.gfine = hf;
    this.gdim  = this.gax.map(q => q.n);
    // 座標 → 番号（JS 側。穴の行を決めるのに使う）
    this.gIndex = (a, x) => {
      const q = this.gax[a], x0 = q.lo + q.nL*hc, x1 = x0 + q.nf*hf;
      if (x <= x0) return (x - q.lo)/hc;
      if (x <= x1) return q.nL + (x - x0)/hf;
      return q.nL + q.nf + (x - x1)/hc;
    };
    this.nF     = (this.gdim[0] + 1)*(this.gdim[1] + 1)*(this.gdim[2] + 1);
    this.nCells = this.gdim[0]*this.gdim[1]*this.gdim[2];
  },

  initGrid(dev, mk){
    const nf = this.nF;
    const B = {
      acc: mk(nf*32), U: mk(nf*16), A: mk(nf*16), L: mk(nf*16), B: mk(nf*16), P: mk(nf*16),
      red: mk((16 + Math.ceil(nf/256))*4),
    };
    this.gb  = B;
    this.gub = dev.createBuffer({ size: 160, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.gData = new Float32Array(40);
    this.gU32  = new Uint32Array(this.gData.buffer);

    const mod = dev.createShaderModule({ code: buildGridWGSL(SHAPE), label: 'grid' });
    // 入口ごとに使うバッファが違う（1本の配置にまとめると上限の8本を超える）ので、
    // 配置は自動にし、入口ごとに使う番号だけを束ねる。
    const res = {
      0: this.gub, 1: B.acc, 2: B.U, 3: B.A, 4: B.L, 5: B.B, 6: B.P, 7: B.red,
      8: this.bufPos, 9: this.bufVel, 10: this.bufStat, 11: this.bufRender,
    };
    const mkp = (name, binds) => {
      const pipeline = dev.createComputePipeline({
        layout: 'auto', compute: { module: mod, entryPoint: name }, label: name });
      const bg = dev.createBindGroup({ layout: pipeline.getBindGroupLayout(0),
        entries: binds.map(b => ({ binding: b, resource: { buffer: res[b] } })) });
      return { pipeline, bg };
    };
    this.gp = {
      init    : mkp('gsInit',    [0, 3, 4, 6]),
      clear   : mkp('gsClear',   [0, 1]),
      p2g     : mkp('gsP2G',     [0, 1, 8, 9]),
      combine : mkp('gsCombine', [0, 1, 2, 3, 4, 5]),
      visc0   : mkp('gsVisc0',   [0, 2, 3, 5, 6]),
      viscPA  : mkp('gsViscPA',  [0, 2, 3, 5, 6]),
      viscAP  : mkp('gsViscAP',  [0, 2, 3, 5, 6]),
      viscEnd : mkp('gsViscEnd', [0, 2, 6]),
      chSum   : mkp('gsChSum',   [0, 2, 4, 7]),
      chBeta  : mkp('gsChBeta',  [0, 5, 7]),
      redCh   : mkp('gsRedCh',   [0, 7]),
      redChB  : mkp('gsRedChB',  [0, 7]),
      chFix   : mkp('gsChFix',   [0, 2, 4, 5, 6, 7]),
      tgtSum  : mkp('gsTgtSum',  [0, 5, 7]),
      redTgt  : mkp('gsRedTgt',  [0, 7]),
      tgtCnt  : mkp('gsTgtCnt',  [0, 5, 7]),
      redCnt  : mkp('gsRedCnt',  [0, 7]),
      resid   : mkp('gsResid',   [0, 2, 4, 5, 6, 7]),
      redInit : mkp('gsRedInit', [0, 7]),
      apply   : mkp('gsApply',   [0, 4, 5, 6, 7]),
      redA    : mkp('gsRedA',    [0, 7]),
      update  : mkp('gsUpdate',  [0, 4, 5, 6, 7]),
      redB    : mkp('gsRedB',    [0, 7]),
      dir     : mkp('gsDir',     [0, 4, 5, 6, 7]),
      project : mkp('gsProject', [0, 2, 5, 6]),
      advect  : mkp('gsAdvect',  [0, 2, 3, 4]),
      g2p     : mkp('gsG2P',     [0, 2, 4, 5, 8, 9]),
      airDraw : mkp('gsAirDraw', [0, 2, 4, 11]),
      stats   : mkp('gsStats',   [0, 2, 4, 10]),
    };
    this.gNeedInit = true;
  },

  writeGridParams(dev, dt, g){
    const D = this.gData, Uu = this.gU32, s = this.spacing;
    Uu[0]=this.gdim[0]; Uu[1]=this.gdim[1]; Uu[2]=this.gdim[2]; Uu[3]=this.N;
    D[4]=0; D[5]=0; D[6]=0; D[7]=this.gdx;
    D[8]=dt; D[9]=1/CONFIG.sim.densityRatio; D[10]=CONFIG.sim.flip; D[11]=CONFIG.sim.phiFull;
    D[12]=g[0]; D[13]=g[1]; D[14]=g[2]; D[15]=Math.pow(this.gdx/s, 3);
    const O = SHAPE.orifice.p;
    D[16]=O[0]; D[17]=O[1]; D[18]=O[2]; D[19]=0;
    D[20]=CONFIG.sim.gridVisc; D[21]=CONFIG.sim.volCorr; D[22]=CONFIG.sim.gridViscWall;
    D[23]=Math.floor(this.gIndex(1, O[1]));   // 穴の中ほどの行。ここより上を上の部屋とする
    D[24]=this.gfine; D[25]=0; D[26]=0; D[27]=0;
    for (let a = 0; a < 3; a++) {
      const q = this.gax[a];
      D[28 + a*4]=q.lo; D[29 + a*4]=q.nL; D[30 + a*4]=q.nf; D[31 + a*4]=0;
    }
    dev.queue.writeBuffer(this.gub, 0, D);
  },

  // 格子の1ステップ。粒子の PBF の前に、同じパスの中で走らせる
  gridStep(pass){
    const run = (p, n) => {
      pass.setPipeline(p.pipeline); pass.setBindGroup(0, p.bg); pass.dispatchWorkgroups(n);
    };
    const P = this.gp, w64 = Math.ceil(this.nF/64), w256 = Math.ceil(this.nF/256);
    const wgP = Math.ceil(this.N/64);
    if (this.gNeedInit) { run(P.init, w64); this.gNeedInit = false; }
    run(P.clear,   w64);
    run(P.p2g,     wgP);
    run(P.combine, w64);
    if (CONFIG.sim.gridVisc > 0) {
      run(P.visc0, w64);
      for (let it = 0; it < CONFIG.sim.gridViscIters; it++) { run(P.viscPA, w64); run(P.viscAP, w64); }
      run(P.viscEnd, w64);
    }
    run(P.tgtSum,  w256);
    run(P.redTgt,  1);
    run(P.tgtCnt,  w256);
    run(P.redCnt,  1);
    run(P.resid,   w256);
    run(P.redInit, 1);
    for (let it = 0; it < CONFIG.sim.cgIters; it++) {
      run(P.apply,  w256);
      run(P.redA,   1);
      run(P.update, w256);
      run(P.redB,   1);
      run(P.dir,    w256);
    }
    run(P.project, w64);
    run(P.chSum,   w256);
    run(P.redCh,   1);
    run(P.chBeta,  w256);
    run(P.redChB,  1);
    run(P.chFix,   w64);
    run(P.advect,  w64);
    run(P.g2p,     wgP);
  },

  // 泡を描くための球を置く（1フレームに1回でよい）
  gridDraw(enc){
    if (!this.grid) return;
    const pass = enc.beginComputePass();
    pass.setPipeline(this.gp.airDraw.pipeline); pass.setBindGroup(0, this.gp.airDraw.bg);
    pass.dispatchWorkgroups(Math.ceil(this.nCells/64));
    pass.end();
  },

  writeParams(dev, dt, g){
    const C = CONFIG.sim, D = this.spData, Uu = this.spU32;
    const h = this.h, s = this.spacing;
    const poly6C = 315/(64*Math.PI*Math.pow(h, 9));
    const spikyC = -45/(Math.PI*Math.pow(h, 6));
    const wq     = poly6(Math.pow(C.sCorrQ*h, 2), h);

    // λ の分母のおおよその大きさ。CFM と人工圧力をこれに合わせて正規化すると、
    // 粒子数や平滑化半径を変えても同じ見え方になる。
    const gradN  = (45/(Math.PI*Math.pow(h, 6)))*Math.pow(0.5*h, 2)/this.rho0;
    const denomR = Math.max(30*gradN*gradN, 1e-20);
    // 凝集カーネルも同様に正規化する。1.0 で重力と同程度の加速度になる。
    const cohR   = Math.PI*h*h*h/15;

    D[0]=g[0]; D[1]=g[1]; D[2]=g[2];  D[3]=dt;
    D[4]=this.origin[0]; D[5]=this.origin[1]; D[6]=this.origin[2]; D[7]=h;
    Uu[8]=this.dims[0]; Uu[9]=this.dims[1]; Uu[10]=this.dims[2]; Uu[11]=this.N;
    D[12]=h; D[13]=poly6C; D[14]=spikyC; D[15]=this.rho0;
    D[16]=C.relax*denomR; D[17]=C.sCorrK/denomR; D[18]=C.sCorrN; D[19]=Math.max(wq, 1e-12);
    D[20]=C.viscosity; D[21]=C.cohesionLiq*cohR; D[22]=C.adhesion; D[23]=C.wallFric;
    D[24]=C.radius*s; D[25]=C.maxVel; D[26]=C.wallBand*s; D[27]=C.damping;
    D[28]=this.nLiquid; D[29]=C.densityRatio; D[30]=C.phaseRepel*s; D[31]=C.cohesionGas*cohR;
    D[32]=C.viscCross; D[33]=C.wallFricGas; D[34]=C.phaseRepel*s*0.9; D[35]=SHAPE.cavityBound.r;
    D[36]=C.swirl; D[37]=Math.max(C.swirlWidth, 1e-3); D[38]=this.grid ? 0 : 1; D[39]=0;
    const O = SHAPE.orifice.p;
    D[40]=O[0]; D[41]=O[1]; D[42]=O[2]; D[43]=0;
    dev.queue.writeBuffer(this.ub, 0, D);
  },

  // 1フレームぶんを進める
  step(dev, enc, dt, gravityDir){
    if (!this.ready) return;
    const C = CONFIG.sim;
    const sub = C.substeps;
    const h   = dt/sub;
    const j   = Gravity.jolt;
    const g   = [gravityDir[0]*C.gravity + j[0],
                 gravityDir[1]*C.gravity + j[1],
                 gravityDir[2]*C.gravity + j[2]];
    const wgP = Math.ceil(this.N/64);
    const wgC = Math.ceil(this.cells/64);

    this.writeParams(dev, h, g);
    if (this.grid) this.writeGridParams(dev, h, g);

    for (let k = 0; k < sub; k++) {
      const pass = enc.beginComputePass();
      if (this.grid) this.gridStep(pass);
      let a = 0;
      const run = (pipe, n) => {
        pass.setPipeline(pipe);
        pass.setBindGroup(0, this.bg[a]);
        pass.dispatchWorkgroups(n);
      };

      run(this.p.predict, wgP);
      run(this.p.clear,   wgC);
      run(this.p.build,   wgP);
      for (let it = 0; it < C.iters; it++) {
        run(this.p.lambda, wgP);
        run(this.p.delta,  wgP);   // cur -> nxt
        a ^= 1;
      }
      run(this.p.final, wgP);
      for (let it = 0; it < C.viscIters; it++) {
        run(this.p.visc,   wgP);   // pos,vel -> nxt
        run(this.p.applyV, wgP);
      }
      if (DEBUG && k === sub - 1) {
        run(this.p.statCl, 1);
        run(this.p.stat,   wgP);
        if (this.grid) {
          pass.setPipeline(this.gp.stats.pipeline); pass.setBindGroup(0, this.gp.stats.bg);
          pass.dispatchWorkgroups(Math.ceil(this.nF/64));
        }
      }
      pass.end();
    }

    // 描画用の位置をならす
    const rp = enc.beginComputePass();
    rp.setPipeline(this.pRender);
    rp.setBindGroup(0, this.bgRender);
    rp.dispatchWorkgroups(wgP);
    rp.end();
  },

  // 交換量の読み戻し（調整用。?debug=1 のときだけ）
  copyStats(enc){
    if (!this.ready || !DEBUG) return;
    const st = this.stage.find(x => !x.busy);
    if (!st) return;
    st.busy = true;
    this.pending = st;
    enc.copyBufferToBuffer(this.bufStat, 0, st.buf, 0, 32);
  },
  mapStats(){
    const st = this.pending;
    if (!st) return;
    this.pending = null;
    st.buf.mapAsync(GPUMapMode.READ).then(() => {
      this.stats.set(new Uint32Array(st.buf.getMappedRange()));
      st.buf.unmap();
      st.busy = false;
    }).catch(() => { st.busy = false; });
  },

  // 粒子を初期状態に戻す
  reseed(dev){
    if (!this.ready) return;
    const seed = seedParticles(CONFIG.sim.particles);
    const n = Math.min(seed.count, this.N);
    dev.queue.writeBuffer(this.bufPos, 0, seed.positions, 0, n*4);
    dev.queue.writeBuffer(this.bufRender, 0, seed.positions, 0, n*4);
    dev.queue.writeBuffer(this.bufVel, 0, new Float32Array(this.N*4));
    if (this.grid) this.gNeedInit = true;  // 空気の速度と圧力も消す
  },
};

/* ==========================================================================
   GPU — WebGPU バックエンド
   ========================================================================== */

const ENV_PRESETS = { studio: 0, room: 1, sunset: 2 };

const Gpu = {
  ok: false,
  dev: null, ctx: null, fmt: null, adapterInfo: {},
  ub: null, ubData: new Float32Array(96),
  w: 0, h: 0,

  async init(canvas){
    if (!navigator.gpu) throw new Error(
      'このブラウザは WebGPU に対応していないため、まだ動かせません。\n' +
      'iPhone なら iOS 18 以降の Safari、Android なら新しい Chrome でお試しください。');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('GPU アダプタを取得できませんでした。');
    const dev = await adapter.requestDevice();
    this.dev = dev;
    this.adapterInfo = adapter.info || {};
    dev.lost.then((info) => showError('GPU との接続が切れました。', info.message || ''));

    const ctx = canvas.getContext('webgpu');
    if (!ctx) throw new Error('WebGPU のキャンバスを作れませんでした。');
    this.ctx = ctx;
    this.fmt = navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({ device: dev, format: this.fmt, alphaMode: 'opaque' });

    this.smp = dev.createSampler({
      magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear',
      addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    });
    this.ub    = dev.createBuffer({ size: 384, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.envUB = dev.createBuffer({ size: 16,  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    // --- 環境キューブマップ ---
    const S = CONFIG.env.faceSize, MIPS = CONFIG.env.mipCount;
    this.envTex = dev.createTexture({
      size: [S, S, 6], format: 'rgba16float', mipLevelCount: MIPS,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    this.envView = this.envTex.createView({ dimension: 'cube' });

    // --- シェーダ ---
    const mods = {
      env   : dev.createShaderModule({ code: WGSL_ENVGEN,  label: 'envgen'  }),
      blur  : dev.createShaderModule({ code: WGSL_ENVBLUR, label: 'envblur' }),
      part  : dev.createShaderModule({ code: WGSL_PART,    label: 'part'    }),
      smooth: dev.createShaderModule({ code: WGSL_SMOOTH,  label: 'smooth'  }),
      main  : dev.createShaderModule({ code: buildMainWGSL(SHAPE), label: 'main' }),
      post  : dev.createShaderModule({ code: WGSL_POST,    label: 'post'    }),
    };
    for (const [name, mod] of Object.entries(mods)) {
      const info = await mod.getCompilationInfo();
      const bad = info.messages.filter(m => m.type === 'error');
      if (bad.length) {
        throw new Error('シェーダ(' + name + ')のコンパイルに失敗:\n' +
          bad.map(m => `  行${m.lineNum}: ${m.message}`).join('\n'));
      }
    }

    const tgt = (format, blend) => ({ targets: [blend ? { format, blend } : { format }] });
    const add = { color: { srcFactor:'one', dstFactor:'one' }, alpha: { srcFactor:'one', dstFactor:'one' } };

    this.pipeEnv = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.env, entryPoint:'vsFull' },
      fragment:{ module: mods.env, entryPoint:'fsEnv', ...tgt('rgba16float') } });
    this.pipeBlur = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.blur, entryPoint:'vsFull' },
      fragment:{ module: mods.blur, entryPoint:'fsBlur', ...tgt('rgba16float') } });

    this.pipePartDepth = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.part, entryPoint:'vsPart' },
      fragment:{ module: mods.part, entryPoint:'fsPartDepth', ...tgt('r32float') },
      depthStencil:{ format:'depth32float', depthWriteEnabled:true, depthCompare:'less' } });
    this.pipePartThick = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.part, entryPoint:'vsPart' },
      fragment:{ module: mods.part, entryPoint:'fsPartThick', ...tgt('r16float', add) } });

    this.pipeSmoothX = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.smooth, entryPoint:'vsFull' },
      fragment:{ module: mods.smooth, entryPoint:'fsSmoothX', ...tgt('r32float') } });
    this.pipeSmoothY = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.smooth, entryPoint:'vsFull' },
      fragment:{ module: mods.smooth, entryPoint:'fsSmoothY', ...tgt('r32float') } });

    this.pipeMain = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.main, entryPoint:'vsFull' },
      fragment:{ module: mods.main, entryPoint:'fsMain', ...tgt('rgba16float') } });
    this.pipePost = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.post, entryPoint:'vsFull' },
      fragment:{ module: mods.post, entryPoint:'fsPost', ...tgt(this.fmt) } });

    this.bgEnv = dev.createBindGroup({ layout: this.pipeEnv.getBindGroupLayout(0),
      entries: [{ binding:0, resource:{ buffer: this.envUB } }] });

    Sim.init(dev);
    this.bgPart = dev.createBindGroup({ layout: this.pipePartDepth.getBindGroupLayout(0),
      entries: [
        { binding:0, resource:{ buffer: this.ub } },
        { binding:1, resource:{ buffer: Sim.bufRender } },
      ]});
    this.bgPartThick = dev.createBindGroup({ layout: this.pipePartThick.getBindGroupLayout(0),
      entries: [
        { binding:0, resource:{ buffer: this.ub } },
        { binding:1, resource:{ buffer: Sim.bufRender } },
      ]});

    this.ok = true;
    this.buildEnv(CONFIG.env.preset);
  },

  buildEnv(presetName){
    const dev = this.dev;
    const preset = ENV_PRESETS[presetName] ?? 0;
    const MIPS = CONFIG.env.mipCount;
    const u32 = new Uint32Array(2), f32 = new Float32Array(2);

    const renderFace = (pipeline, bindGroup, mip, face) => {
      const view = this.envTex.createView({
        dimension:'2d', baseMipLevel:mip, mipLevelCount:1,
        baseArrayLayer:face, arrayLayerCount:1,
      });
      const enc = dev.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments:[{
        view, loadOp:'clear', storeOp:'store', clearValue:{ r:0,g:0,b:0,a:1 } }]});
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(3);
      pass.end();
      dev.queue.submit([enc.finish()]);
    };

    for (let face = 0; face < 6; face++) {
      u32[0] = face; u32[1] = preset; f32[0] = 0; f32[1] = 0;
      dev.queue.writeBuffer(this.envUB, 0, u32);
      dev.queue.writeBuffer(this.envUB, 8, f32);
      renderFace(this.pipeEnv, this.bgEnv, 0, face);
    }
    for (let mip = 1; mip < MIPS; mip++) {
      const srcView = this.envTex.createView({
        dimension:'cube', baseMipLevel:mip-1, mipLevelCount:1,
        baseArrayLayer:0, arrayLayerCount:6,
      });
      const bg = dev.createBindGroup({ layout: this.pipeBlur.getBindGroupLayout(0), entries:[
        { binding:0, resource:{ buffer: this.envUB } },
        { binding:1, resource: srcView },
        { binding:2, resource: this.smp },
      ]});
      const lobe = 0.10*Math.pow(2, mip - 1);
      for (let face = 0; face < 6; face++) {
        u32[0] = face; u32[1] = preset; f32[0] = lobe; f32[1] = 0;
        dev.queue.writeBuffer(this.envUB, 0, u32);
        dev.queue.writeBuffer(this.envUB, 8, f32);
        renderFace(this.pipeBlur, bg, mip, face);
      }
    }
  },

  resize(w, h){
    if (w === this.w && h === this.h) return;
    this.w = w; this.h = h;
    const dev = this.dev;
    for (const t of ['hdrTex','liqA','liqB','gasA','gasB','thickLiq','thickGas','depthTex'])
      if (this[t]) this[t].destroy();

    const mkTex = (format, usage) => dev.createTexture({ size:[w, h], format, usage });
    const RT = GPUTextureUsage.RENDER_ATTACHMENT, TB = GPUTextureUsage.TEXTURE_BINDING;

    // 流体の面は画面より低い解像度で作る。平滑化の手数を増やさずに
    // 広い範囲を均せるので、粒の凹凸が消えてつながった液体に見える。
    const fs = CONFIG.view.fluidScale;
    const fw = Math.max(8, Math.round(w*fs));
    const fh = Math.max(8, Math.round(h*fs));
    this.fw = fw; this.fh = fh;
    const fTex = (fmt) => dev.createTexture({ size:[fw, fh], format: fmt, usage: RT | TB });

    this.hdrTex   = mkTex('rgba16float',  RT | TB);
    this.liqA     = fTex('r32float');   // 液体の前面の深度
    this.liqB     = fTex('r32float');   // 平滑化の作業用
    this.gasA     = fTex('r32float');   // 空気の前面の深度
    this.gasB     = fTex('r32float');
    this.thickLiq = fTex('r16float');
    this.thickGas = fTex('r16float');
    this.depthTex = dev.createTexture({ size:[fw, fh], format:'depth32float', usage: RT });

    this.hdrView   = this.hdrTex.createView();
    this.liqAView  = this.liqA.createView();
    this.liqBView  = this.liqB.createView();
    this.gasAView  = this.gasA.createView();
    this.gasBView  = this.gasB.createView();
    this.thickLView= this.thickLiq.createView();
    this.thickGView= this.thickGas.createView();
    this.depthView = this.depthTex.createView();

    this.bgMain = dev.createBindGroup({ layout: this.pipeMain.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: this.envView },
      { binding:2, resource: this.smp },
      { binding:3, resource: this.liqAView },
      { binding:4, resource: this.thickLView },
      { binding:5, resource: this.gasAView },
      { binding:6, resource: this.thickGView },
    ]});
    this.bgPost = dev.createBindGroup({ layout: this.pipePost.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: this.hdrView },
      { binding:2, resource: this.smp },
    ]});
    const smBG = (pipe, view) => dev.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: view },
    ]});
    this.bgSmLX = smBG(this.pipeSmoothX, this.liqAView);
    this.bgSmLY = smBG(this.pipeSmoothY, this.liqBView);
    this.bgSmGX = smBG(this.pipeSmoothX, this.gasAView);
    this.bgSmGY = smBG(this.pipeSmoothY, this.gasBView);
  },

  render(dt, gravityDir){
    const dev = this.dev;
    const enc = dev.createCommandEncoder();

    // 1) 流体を進める
    Sim.step(dev, enc, dt, gravityDir);
    Sim.gridDraw(enc);

    const col = (view, clear) => ({ view, loadOp:'clear', storeOp:'store', clearValue: clear });
    const FARC = { r:FAR, g:0, b:0, a:0 };
    const ZERO = { r:0, g:0, b:0, a:0 };

    // 粒子を球として描いて、相ごとに前面の深度を取る
    const depthPass = (view, first, count) => {
      const pass = enc.beginRenderPass({
        colorAttachments:[col(view, FARC)],
        depthStencilAttachment:{
          view: this.depthView, depthLoadOp:'clear', depthStoreOp:'store', depthClearValue:1.0,
        },
      });
      if (count > 0) {
        pass.setPipeline(this.pipePartDepth);
        pass.setBindGroup(0, this.bgPart);
        pass.draw(6, count, 0, first);
      }
      pass.end();
    };
    // 深度の平滑化（横 -> 縦）
    const smoothPass = (dst, pipe, bg, clear) => {
      const pass = enc.beginRenderPass({ colorAttachments:[col(dst, clear)] });
      pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
    };
    // 厚み（吸収と、スラブの奥行きに使う）
    const thickPass = (view, first, count) => {
      const pass = enc.beginRenderPass({ colorAttachments:[col(view, ZERO)] });
      if (count > 0) {
        pass.setPipeline(this.pipePartThick);
        pass.setBindGroup(0, this.bgPartThick);
        pass.draw(6, count, 0, first);
      }
      pass.end();
    };

    depthPass(this.liqAView, 0, Sim.nLiquid);
    smoothPass(this.liqBView, this.pipeSmoothX, this.bgSmLX, FARC);
    smoothPass(this.liqAView, this.pipeSmoothY, this.bgSmLY, FARC);

    depthPass(this.gasAView, Sim.nLiquid, Sim.nGas);
    smoothPass(this.gasBView, this.pipeSmoothX, this.bgSmGX, FARC);
    smoothPass(this.gasAView, this.pipeSmoothY, this.bgSmGY, FARC);

    thickPass(this.thickLView, 0, Sim.nLiquid);
    thickPass(this.thickGView, Sim.nLiquid, Sim.nGas);

    // 本体
    {
      const pass = enc.beginRenderPass({ colorAttachments:[col(this.hdrView, { r:0,g:0,b:0,a:1 })] });
      pass.setPipeline(this.pipeMain); pass.setBindGroup(0, this.bgMain); pass.draw(3); pass.end();
    }
    // トーンマップ
    {
      const pass = enc.beginRenderPass({
        colorAttachments:[col(this.ctx.getCurrentTexture().createView(), { r:0,g:0,b:0,a:1 })] });
      pass.setPipeline(this.pipePost); pass.setBindGroup(0, this.bgPost); pass.draw(3); pass.end();
    }
    Sim.copyStats(enc);
    dev.queue.submit([enc.finish()]);
    Sim.mapStats();
  },
};

/* ==========================================================================
   APP — 初期化・リサイズ・メインループ
   ========================================================================== */

const canvas = document.getElementById('view');
const hud    = document.getElementById('hud');

function showError(msg, detail){
  document.getElementById('errmsg').textContent = msg;
  document.getElementById('errdetail').textContent = detail || '';
  document.getElementById('errdetail').style.display = detail ? '' : 'none';
  document.getElementById('err').classList.add('show');
  console.error(msg, detail || '');
}

// --- カメラ（固定。わずかに見下ろす） ---
const CAM = (() => {
  const el = 0.0, az = 0.0;
  const d  = CONFIG.view.camDist;
  const pos = [d*Math.cos(el)*Math.sin(az), d*Math.sin(el), d*Math.cos(el)*Math.cos(az)];
  const L = Math.hypot(...pos);
  const fwd = pos.map(v => -v/L);
  let rx = fwd[1]*0 - fwd[2]*1, ry = fwd[2]*0 - fwd[0]*0, rz = fwd[0]*1 - fwd[1]*0;
  const rl = Math.hypot(rx, ry, rz); rx/=rl; ry/=rl; rz/=rl;
  const up = [
    ry*fwd[2] - rz*fwd[1],
    rz*fwd[0] - rx*fwd[2],
    rx*fwd[1] - ry*fwd[0],
  ];
  return { pos, fwd, right:[rx, ry, rz], up, tanHalf: CONFIG.view.fitHalfHeight/d };
})();

let renderW = 0, renderH = 0, aspect = 1;

// 描画の重さに合わせて解像度を上下させる。
// 計算（ソルバ）が時間の大半を使うので、狙いは「20fps前後を保ちつつ
// 余った分を解像度に回す」こと。高いfpsを狙うと解像度が落ちすぎる。
const Quality = {
  scale: 0.85, min: 0.55, max: 1.0,
  target: 46, acc: 0, n: 0, hold: 1.2,
  update(dt, ms){
    this.acc += ms; this.n++;
    this.hold -= dt;
    if (this.n < 30 || this.hold > 0) return;
    const avg = this.acc/this.n;
    this.acc = 0; this.n = 0;
    if (avg > this.target + 6 && this.scale > this.min) {
      this.scale = Math.max(this.min, this.scale - 0.10);
      this.hold = 1.5; resize();
    } else if (avg < this.target - 10 && this.scale < this.max) {
      this.scale = Math.min(this.max, this.scale + 0.05);
      this.hold = 3.0; resize();
    }
  },
};

function resize(){
  const cssW = Math.max(1, Math.round(canvas.clientWidth  || innerWidth));
  const cssH = Math.max(1, Math.round(canvas.clientHeight || innerHeight));
  const dpr  = Math.min(devicePixelRatio || 1, CONFIG.view.maxDpr)*Quality.scale;
  const MAXPIX = 2.6e6;
  let w = Math.round(cssW*dpr), h = Math.round(cssH*dpr);
  if (w*h > MAXPIX) {
    const k = Math.sqrt(MAXPIX/(w*h));
    w = Math.max(1, Math.round(w*k));
    h = Math.max(1, Math.round(h*k));
  }
  if (w === renderW && h === renderH) return;
  renderW = w; renderH = h; aspect = w/h;
  canvas.width = w; canvas.height = h;
  if (Gpu.ok) Gpu.resize(w, h);
}

function writeUniforms(time){
  const U = Gpu.ubData;
  const R = CAM.right, Up = CAM.up, F = CAM.fwd, P = CAM.pos;
  const gUp = Gravity.up;
  const L = CONFIG.liquid, G = CONFIG.glass;

  // view（世界 -> ビュー、列優先）
  U[0]=R[0];  U[1]=Up[0]; U[2]=-F[0]; U[3]=0;
  U[4]=R[1];  U[5]=Up[1]; U[6]=-F[1]; U[7]=0;
  U[8]=R[2];  U[9]=Up[2]; U[10]=-F[2]; U[11]=0;
  U[12]=-(R[0]*P[0]+R[1]*P[1]+R[2]*P[2]);
  U[13]=-(Up[0]*P[0]+Up[1]*P[1]+Up[2]*P[2]);
  U[14]=  F[0]*P[0]+F[1]*P[1]+F[2]*P[2];
  U[15]=1;

  // proj（透視投影。z は 0..1）
  const near = 0.25, far = 24.0;
  const fy = 1/CAM.tanHalf;
  U[16]=fy/aspect; U[17]=0;  U[18]=0;                  U[19]=0;
  U[20]=0;         U[21]=fy; U[22]=0;                  U[23]=0;
  U[24]=0;         U[25]=0;  U[26]=far/(near-far);     U[27]=-1;
  U[28]=0;         U[29]=0;  U[30]=far*near/(near-far); U[31]=0;

  // viewProj = proj * view（列優先）
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += U[16 + k*4 + r]*U[c*4 + k];
      U[32 + c*4 + r] = v;
    }

  U[48]=R[0];  U[49]=R[1];  U[50]=R[2];  U[51]=CAM.tanHalf;
  U[52]=Up[0]; U[53]=Up[1]; U[54]=Up[2]; U[55]=aspect;
  const VIEWS = { phase: 1, gas: 2, liq: 3 };
  U[56]=F[0];  U[57]=F[1];  U[58]=F[2];  U[59]=VIEWS[QS.get('view')] || 0;
  U[60]=P[0];  U[61]=P[1];  U[62]=P[2];  U[63]=time;
  U[64]=gUp[0]; U[65]=gUp[1]; U[66]=gUp[2]; U[67]=0;
  U[68]=L.color[0]; U[69]=L.color[1]; U[70]=L.color[2]; U[71]=L.absorb;
  U[72]=G.color[0]; U[73]=G.color[1]; U[74]=G.color[2]; U[75]=G.absorb;
  U[76]=G.ior; U[77]=L.ior; U[78]=G.roughness; U[79]=CONFIG.view.exposure;
  U[80]=renderW; U[81]=renderH; U[82]=1/renderW; U[83]=1/renderH;
  U[84]=SHAPE.bound.r; U[85]=SHAPE.bound.h;
  U[86]=CONFIG.env.mipCount - 1; U[87]=CONFIG.env.bgGain;

  // 流体の描画パラメータ（平滑化の半径は「流体バッファの画素」で数える）
  const fw = Gpu.fw || Math.max(8, Math.round(renderW*CONFIG.view.fluidScale));
  const fh = Gpu.fh || Math.max(8, Math.round(renderH*CONFIG.view.fluidScale));
  const s  = Sim.spacing || 0.02;
  const pr = CONFIG.sim.drawRadius*s;
  const screenR = pr/(CONFIG.view.camDist*CAM.tanHalf)*(fh*0.5);
  U[88]=pr;
  U[89]=3*s*s*s/(4*Math.PI*pr*pr*pr);
  U[90]=Math.max(4, Math.min(30, Math.round(screenR*3.0)));
  U[91]=FAR;
  U[92]=fw; U[93]=fh; U[94]=1/fw; U[95]=1/fh;

  Gpu.dev.queue.writeBuffer(Gpu.ub, 0, U);
}

const Perf = { t:0, n:0, fps:0, ms:0 };
let lastT = 0;

function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000) || 0.016;
  lastT = now;

  if (document.hidden) { requestAnimationFrame(frame); return; }
  Quality.update(dt, dt*1000);
  resize();
  Gravity.update(dt);
  writeUniforms(now/1000);
  const dtSim = Math.min(dt, 1/45);
  TSIM.t += dtSim;
  Gpu.render(dtSim, Gravity.down);

  Perf.t += dt; Perf.n++;
  if (Perf.t >= 0.5) {
    Perf.fps = Perf.n/Perf.t; Perf.ms = 1000*Perf.t/Perf.n;
    Perf.t = 0; Perf.n = 0;
    if (DEBUG) {
      const g = Gravity.down;
      hud.textContent =
        `fps ${Perf.fps.toFixed(1)}  (${Perf.ms.toFixed(2)} ms)\n` +
        `描画 ${renderW}x${renderH}  品質 ${Quality.scale.toFixed(2)}\n` +
        `粒子 ${Sim.N}  間隔 ${Sim.spacing.toFixed(4)}  h ${Sim.h.toFixed(4)}\n` +
        `格子 ${Sim.dims.join('x')} = ${Sim.cells}  ρ0 ${Sim.rho0.toFixed(1)}\n` +
        `液体 ${Sim.nLiquid}  空気 ${Sim.nGas}\n` +
        `上に来た空気 ${Sim.stats[0]}  下に落ちた液体 ${Sim.stats[1]}\n` +
        `空気の詰まり 最大 ${(Sim.stats[2]/1000).toFixed(2)}  平均 ${(Sim.stats[3]*100/1000/Math.max(Sim.nGas,1)).toFixed(2)}\n` +
        `紐 ${threadPct().toFixed(1)}%  (${Sim.stats[4]}/${Sim.stats[5]})  落下率 ${(100*Sim.stats[1]/Math.max(Sim.nLiquid,1)).toFixed(1)}%  計算内 ${TSIM.t.toFixed(0)}s / 実時間 ${((now-T0)/1000).toFixed(0)}s\n` +
        `形状 ${CONFIG.shape}  環境 ${CONFIG.env.preset}\n` +
        `重力 ${g[0].toFixed(2)} ${g[1].toFixed(2)} ${g[2].toFixed(2)}\n` +
        `GPU ${Gpu.adapterInfo.vendor || '?'} / ${Gpu.adapterInfo.architecture || '?'}`;
    }
  }
  requestAnimationFrame(frame);
}

const LIQUID_PRESETS = [
  { name:'ブルー',   c:[0.13, 0.50, 0.96] },
  { name:'シアン',   c:[0.08, 0.72, 0.80] },
  { name:'グリーン', c:[0.22, 0.76, 0.32] },
  { name:'ライム',   c:[0.62, 0.84, 0.14] },
  { name:'イエロー', c:[0.96, 0.78, 0.10] },
  { name:'アンバー', c:[0.97, 0.47, 0.08] },
  { name:'レッド',   c:[0.93, 0.15, 0.18] },
  { name:'パープル', c:[0.56, 0.22, 0.94] },
];

function hsv2rgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  const c = v*s, x = c*(1 - Math.abs((h/60)%2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h <  60)      { r=c; g=x; }
  else if (h < 120) { r=x; g=c; }
  else if (h < 180) { g=c; b=x; }
  else if (h < 240) { g=x; b=c; }
  else if (h < 300) { r=x; b=c; }
  else              { r=c; b=x; }
  return [r+m, g+m, b+m];
}
function rgb2hue(c){
  const mx = Math.max(...c), mn = Math.min(...c);
  if (mx - mn < 1e-6) return 210;
  let h;
  if (mx === c[0])      h = 60*(((c[1]-c[2])/(mx-mn))%6);
  else if (mx === c[1]) h = 60*((c[2]-c[0])/(mx-mn) + 2);
  else                  h = 60*((c[0]-c[1])/(mx-mn) + 4);
  return (h + 360)%360;
}
const css = (c) => '#' + c.map(v =>
  Math.round(Math.min(1, Math.max(0, Math.pow(v, 1/2.2)))*255).toString(16).padStart(2,'0')).join('');

const UI = (() => {
  const $ = (id) => document.getElementById(id);
  let panel, gear, dimTimer = null, isOpen = false;
  let st = {};

  const load = () => { try { return JSON.parse(localStorage.getItem('oozetube') || '{}'); } catch(_) { return {}; } };
  const save = () => { try { localStorage.setItem('oozetube', JSON.stringify(st)); } catch(_) {} };

  function applyColor(c){
    CONFIG.liquid.color = c.slice();
    for (const b of $('swatches').children) {
      b.setAttribute('aria-pressed', String(b.dataset.c === c.join(',')));
    }
    const h = Math.round(rgb2hue(c));
    $('sHue').value = h;
    $('vHue').textContent = h + '°';
    $('sHue').style.background =
      'linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)';
  }

  // 粘りは 0〜1 のひとつのつまみで、粘性（粒子どうしの速度の均し）・その回数・
  // 全体の減衰をまとめて動かす。回数まで動かすのは、1回ぶんの均しでは
  // 粘りの上限が決まってしまうため。細い通路でだけよく効く。
  function setViscosity(v){
    const k = Math.max(0, Math.min(1, v));
    CONFIG.sim.viscosity = 0.55 + 0.43*k;
    CONFIG.sim.damping   = 0.08 + 1.4*k;
    CONFIG.sim.viscIters = Math.min(5, Math.max(1, Math.round(1 + 2.2*k)));
    CONFIG.sim.gridVisc  = 0.5 + 3.0*k;     // 空気を格子で持つときの粘性（既定で約3）
    $('sVis').value = k;
    $('vVis').textContent = k.toFixed(2);
  }
  // 既定の粘り（CONFIG の初期値から逆算）
  const viscFromConfig = (c) =>
    Math.max(0, Math.min(1, (c.sim.viscosity - 0.55)/0.43));

  function dimSoon(){
    gear.classList.remove('dim');
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => { if (!isOpen) gear.classList.add('dim'); }, 3500);
  }

  function toggle(on){
    isOpen = (on === undefined) ? !isOpen : on;
    panel.classList.toggle('open', isOpen);
    dimSoon();
  }

  function init(){
    panel = $('panel'); gear = $('gear');
    st = load();

    // --- 色のプリセット ---
    const sw = $('swatches');
    for (const p of LIQUID_PRESETS) {
      const b = document.createElement('button');
      b.style.background = css(p.c);
      b.title = p.name;
      b.dataset.c = p.c.join(',');
      b.onclick = () => { applyColor(p.c); st.color = p.c; save(); };
      sw.appendChild(b);
    }

    // --- 初期値 ---
    applyColor(st.color || CONFIG.liquid.color);
    CONFIG.liquid.absorb   = st.absorb   ?? CONFIG.liquid.absorb;
    CONFIG.sim.cohesionLiq = st.coh      ?? CONFIG.sim.cohesionLiq;
    setViscosity(st.visc ?? viscFromConfig(CONFIG_DEFAULTS));
    $('sAbs').value = CONFIG.liquid.absorb;
    $('vAbs').textContent = CONFIG.liquid.absorb.toFixed(1);
    $('sBub').value = CONFIG.sim.cohesionLiq;
    $('vBub').textContent = CONFIG.sim.cohesionLiq.toFixed(2);
    if (st.env && ENV_PRESETS[st.env] !== undefined) CONFIG.env.preset = st.env;
    for (const b of $('segEnv').children) {
      b.setAttribute('aria-pressed', String(b.dataset.env === CONFIG.env.preset));
      b.onclick = () => {
        CONFIG.env.preset = b.dataset.env;
        st.env = b.dataset.env; save();
        Gpu.buildEnv(CONFIG.env.preset);
        for (const o of $('segEnv').children) o.setAttribute('aria-pressed', String(o === b));
      };
    }

    // --- スライダー ---
    $('sHue').oninput = (e) => {
      const c = hsv2rgb(+e.target.value, 0.88, 0.96);
      applyColor(c); st.color = c; save();
    };
    $('sAbs').oninput = (e) => {
      CONFIG.liquid.absorb = +e.target.value;
      $('vAbs').textContent = CONFIG.liquid.absorb.toFixed(1);
      st.absorb = CONFIG.liquid.absorb; save();
    };
    $('sVis').oninput = (e) => { setViscosity(+e.target.value); st.visc = +e.target.value; save(); };
    $('sBub').oninput = (e) => {
      CONFIG.sim.cohesionLiq = +e.target.value;
      $('vBub').textContent = CONFIG.sim.cohesionLiq.toFixed(2);
      st.coh = CONFIG.sim.cohesionLiq; save();
    };

    // --- ボタン ---
    gear.onclick    = () => toggle();
    $('bFlip').onclick  = () => Gravity.flip();
    $('bReset').onclick = () => Sim.reseed(Gpu.dev);
    // 端末によって傾きの向きが逆になることがあるので、手動で直せるようにする
    Gravity.inverted = !!st.inv;
    const updInvert = () => {
      $('bInvert').textContent = Gravity.inverted ? '上下を元に戻す' : '上下が逆のときはここ';
    };
    updInvert();
    $('bInvert').onclick = () => {
      Gravity.inverted = !Gravity.inverted;
      st.inv = Gravity.inverted; save();
      updInvert();
    };

    // 保存した設定をすべて捨てて、作り手が基準としている値に戻す
    $('bDefault').onclick = () => {
      const D = CONFIG_DEFAULTS;
      CONFIG.liquid.color  = D.liquid.color.slice();
      CONFIG.liquid.absorb = D.liquid.absorb;
      CONFIG.sim.cohesionLiq = D.sim.cohesionLiq;
      CONFIG.env.preset    = D.env.preset;
      setViscosity(viscFromConfig(D));
      applyColor(CONFIG.liquid.color);
      $('sAbs').value = CONFIG.liquid.absorb;
      $('vAbs').textContent = CONFIG.liquid.absorb.toFixed(1);
      $('sBub').value = CONFIG.sim.cohesionLiq;
      $('vBub').textContent = CONFIG.sim.cohesionLiq.toFixed(2);
      for (const o of $('segEnv').children) {
        o.setAttribute('aria-pressed', String(o.dataset.env === CONFIG.env.preset));
      }
      Gpu.buildEnv(CONFIG.env.preset);
      Sim.reseed(Gpu.dev);
      st = {}; save();
      const b = $('bDefault');
      b.textContent = '既定に戻しました';
      setTimeout(() => { b.textContent = '設定を既定に戻す'; }, 2000);
    };

    $('bSensor').onclick = async () => {
      const ok = await Gravity.enableSensors();
      $('bSensor').textContent = ok ? '傾きを使っています' : '傾きを使えませんでした';
      setTimeout(() => { $('bSensor').textContent = 'スマホの傾きを使う'; }, 2600);
    };

    // パネルの外を触ったら閉じる
    addEventListener('pointerdown', (e) => {
      if (!isOpen) return;
      if (e.target.closest && e.target.closest('#panel, #gear')) return;
      toggle(false);
    }, { passive:true });
    addEventListener('pointerdown', dimSoon, { passive:true });
    dimSoon();

    // --- センサーの許可 ---
    // iOS は利用者の操作がないと許可を求められないので、タッチ端末のときだけ
    // 起動時に一度だけ聞く。パソコンでは出さず、パネルのボタンから使える。
    const boot  = $('boot');
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && Gravity.needsPermission()) {
      boot.classList.add('show');
      $('bootOk').onclick = async () => {
        await Gravity.enableSensors();
        boot.classList.remove('show');
      };
    } else if (touch) {
      Gravity.enableSensors();
    }
  }

  return { init, toggle };
})();

(async () => {
  if (DEBUG) hud.hidden = false;
  try {
    resize();
    buildShape(aspect);     // 画面の比率が分かってから容器を作る
    await Gpu.init(canvas);
    Gpu.resize(renderW, renderH);
    UI.init();
    addEventListener('resize', resize);
    requestAnimationFrame((t) => { lastT = t; frame(t); });
  } catch (e) {
    showError(e.message || String(e), e.stack && e.message !== e.stack ? e.stack : '');
  }
})();

</script>
</body>
</html>

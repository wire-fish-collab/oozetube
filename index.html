      fragment:{ module: mods.part, entryPoint:'fsPartThick', ...tgt('r16float', add) } });

    this.pipeBub = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.bub, entryPoint:'vsBub' },
      fragment:{ module: mods.bub, entryPoint:'fsBub', ...tgt('rgba32float') },
      depthStencil:{ format:'depth32float', depthWriteEnabled:true, depthCompare:'less' } });

    this.pipeSmoothX = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.smooth, entryPoint:'vsFull' },
      fragment:{ module: mods.smooth, entryPoint:'fsSmoothX', ...tgt('r32float') } });
    this.pipeSmoothY = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.smooth, entryPoint:'vsFull' },
      fragment:{ module: mods.smooth, entryPoint:'fsSmoothY', ...tgt('r32float') } });

    this.pipeMain = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.main, entryPoint:'vsFull' },
      fragment:{ module: mods.main, entryPoint:'fsMain', ...tgt('rgba16float') } });
    this.pipePost = dev.createRenderPipeline({ layout:'auto',
      vertex:{ module: mods.post, entryPoint:'vsFull' },
      fragment:{ module: mods.post, entryPoint:'fsPost', ...tgt(this.fmt) } });

    this.bgEnv = dev.createBindGroup({ layout: this.pipeEnv.getBindGroupLayout(0),
      entries: [{ binding:0, resource:{ buffer: this.envUB } }] });

    Sim.init(dev);
    this.bgPart = dev.createBindGroup({ layout: this.pipePartDepth.getBindGroupLayout(0),
      entries: [
        { binding:0, resource:{ buffer: this.ub } },
        { binding:1, resource:{ buffer: Sim.bufPos } },
      ]});
    this.bgPartThick = dev.createBindGroup({ layout: this.pipePartThick.getBindGroupLayout(0),
      entries: [
        { binding:0, resource:{ buffer: this.ub } },
        { binding:1, resource:{ buffer: Sim.bufPos } },
      ]});
    this.bgBub = dev.createBindGroup({ layout: this.pipeBub.getBindGroupLayout(0),
      entries: [
        { binding:0, resource:{ buffer: this.ub } },
        { binding:1, resource:{ buffer: Sim.bufBub } },
      ]});

    this.ok = true;
    this.buildEnv(CONFIG.env.preset);
  },

  buildEnv(presetName){
    const dev = this.dev;
    const preset = ENV_PRESETS[presetName] ?? 0;
    const MIPS = CONFIG.env.mipCount;
    const u32 = new Uint32Array(2), f32 = new Float32Array(2);

    const renderFace = (pipeline, bindGroup, mip, face) => {
      const view = this.envTex.createView({
        dimension:'2d', baseMipLevel:mip, mipLevelCount:1,
        baseArrayLayer:face, arrayLayerCount:1,
      });
      const enc = dev.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments:[{
        view, loadOp:'clear', storeOp:'store', clearValue:{ r:0,g:0,b:0,a:1 } }]});
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(3);
      pass.end();
      dev.queue.submit([enc.finish()]);
    };

    for (let face = 0; face < 6; face++) {
      u32[0] = face; u32[1] = preset; f32[0] = 0; f32[1] = 0;
      dev.queue.writeBuffer(this.envUB, 0, u32);
      dev.queue.writeBuffer(this.envUB, 8, f32);
      renderFace(this.pipeEnv, this.bgEnv, 0, face);
    }
    for (let mip = 1; mip < MIPS; mip++) {
      const srcView = this.envTex.createView({
        dimension:'cube', baseMipLevel:mip-1, mipLevelCount:1,
        baseArrayLayer:0, arrayLayerCount:6,
      });
      const bg = dev.createBindGroup({ layout: this.pipeBlur.getBindGroupLayout(0), entries:[
        { binding:0, resource:{ buffer: this.envUB } },
        { binding:1, resource: srcView },
        { binding:2, resource: this.smp },
      ]});
      const lobe = 0.10*Math.pow(2, mip - 1);
      for (let face = 0; face < 6; face++) {
        u32[0] = face; u32[1] = preset; f32[0] = lobe; f32[1] = 0;
        dev.queue.writeBuffer(this.envUB, 0, u32);
        dev.queue.writeBuffer(this.envUB, 8, f32);
        renderFace(this.pipeBlur, bg, mip, face);
      }
    }
  },

  resize(w, h){
    if (w === this.w && h === this.h) return;
    this.w = w; this.h = h;
    const dev = this.dev;
    for (const t of ['hdrTex','liqA','liqB','thickTex','depthTex','bubTex','bubDepth']) if (this[t]) this[t].destroy();

    const mkTex = (format, usage) => dev.createTexture({ size:[w, h], format, usage });
    const RT = GPUTextureUsage.RENDER_ATTACHMENT, TB = GPUTextureUsage.TEXTURE_BINDING;

    this.hdrTex   = mkTex('rgba16float',  RT | TB);
    this.liqA     = mkTex('r32float',     RT | TB);
    this.liqB     = mkTex('r32float',     RT | TB);
    this.thickTex = this.dev.createTexture({
      size:[Math.max(1, w >> 1), Math.max(1, h >> 1)], format:'r16float', usage: RT | TB });
    this.depthTex = mkTex('depth32float', RT);
    this.bubTex   = mkTex('rgba32float',  RT | TB);
    this.bubDepth = mkTex('depth32float', RT);

    this.hdrView   = this.hdrTex.createView();
    this.liqAView  = this.liqA.createView();
    this.liqBView  = this.liqB.createView();
    this.thickView = this.thickTex.createView();
    this.depthView = this.depthTex.createView();
    this.bubView   = this.bubTex.createView();
    this.bubDView  = this.bubDepth.createView();

    this.bgMain = dev.createBindGroup({ layout: this.pipeMain.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: this.envView },
      { binding:2, resource: this.smp },
      { binding:3, resource: this.liqAView },
      { binding:4, resource: this.thickView },
      { binding:5, resource: this.bubView },
    ]});
    this.bgPost = dev.createBindGroup({ layout: this.pipePost.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: this.hdrView },
      { binding:2, resource: this.smp },
    ]});
    this.bgSmX = dev.createBindGroup({ layout: this.pipeSmoothX.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: this.liqAView },
    ]});
    this.bgSmY = dev.createBindGroup({ layout: this.pipeSmoothY.getBindGroupLayout(0), entries:[
      { binding:0, resource:{ buffer: this.ub } },
      { binding:1, resource: this.liqBView },
    ]});
  },

  render(dt, gravityDir){
    const dev = this.dev;
    const enc = dev.createCommandEncoder();

    // 1) 流体を進める
    Sim.step(dev, enc, dt, gravityDir);

    const col = (view, clear) => ({ view, loadOp:'clear', storeOp:'store', clearValue: clear });

    // 2) 粒子を球として描いて液面の深度を取る
    {
      const pass = enc.beginRenderPass({
        colorAttachments:[col(this.liqAView, { r:FAR, g:0, b:0, a:0 })],
        depthStencilAttachment:{
          view: this.depthView, depthLoadOp:'clear', depthStoreOp:'store', depthClearValue:1.0,
        },
      });
      pass.setPipeline(this.pipePartDepth);
      pass.setBindGroup(0, this.bgPart);
      pass.draw(6, Sim.N);
      pass.end();
    }
    // 3) 深度を平滑化（横 -> 縦）
    {
      const pass = enc.beginRenderPass({ colorAttachments:[col(this.liqBView, { r:FAR, g:0, b:0, a:0 })] });
      pass.setPipeline(this.pipeSmoothX); pass.setBindGroup(0, this.bgSmX); pass.draw(3); pass.end();
    }
    {
      const pass = enc.beginRenderPass({ colorAttachments:[col(this.liqAView, { r:FAR, g:0, b:0, a:0 })] });
      pass.setPipeline(this.pipeSmoothY); pass.setBindGroup(0, this.bgSmY); pass.draw(3); pass.end();
    }
    // 4) 厚み（吸収に使う）
    {
      const pass = enc.beginRenderPass({ colorAttachments:[col(this.thickView, { r:0, g:0, b:0, a:0 })] });
      pass.setPipeline(this.pipePartThick);
      pass.setBindGroup(0, this.bgPartThick);
      pass.draw(6, Sim.N);
      pass.end();
    }
    // 5) 泡（手前の泡の中心と半径を画素ごとに残す）
    {
      const pass = enc.beginRenderPass({
        colorAttachments:[col(this.bubView, { r:0, g:0, b:0, a:0 })],
        depthStencilAttachment:{
          view: this.bubDView, depthLoadOp:'clear', depthStoreOp:'store', depthClearValue:1.0,
        },
      });
      if (Bubbles.list.length > 0) {
        pass.setPipeline(this.pipeBub);
        pass.setBindGroup(0, this.bgBub);
        pass.draw(6, Math.min(Bubbles.list.length, CONFIG.bubble.max));
      }
      pass.end();
    }
    // 6) 本体
    {
      const pass = enc.beginRenderPass({ colorAttachments:[col(this.hdrView, { r:0,g:0,b:0,a:1 })] });
      pass.setPipeline(this.pipeMain); pass.setBindGroup(0, this.bgMain); pass.draw(3); pass.end();
    }
    // 7) トーンマップ
    {
      const pass = enc.beginRenderPass({
        colorAttachments:[col(this.ctx.getCurrentTexture().createView(), { r:0,g:0,b:0,a:1 })] });
      pass.setPipeline(this.pipePost); pass.setBindGroup(0, this.bgPost); pass.draw(3); pass.end();
    }
    Sim.copyStats(enc);
    dev.queue.submit([enc.finish()]);
    Sim.mapStats();
  },
};

/* ==========================================================================
   APP — 初期化・リサイズ・メインループ
   ========================================================================== */

const canvas = document.getElementById('view');
const hud    = document.getElementById('hud');

function showError(msg, detail){
  document.getElementById('errmsg').textContent = msg;
  document.getElementById('errdetail').textContent = detail || '';
  document.getElementById('errdetail').style.display = detail ? '' : 'none';
  document.getElementById('err').classList.add('show');
  console.error(msg, detail || '');
}

// --- カメラ（固定。わずかに見下ろす） ---
const CAM = (() => {
  const el = 5.0*Math.PI/180, az = 0.0;
  const d  = CONFIG.view.camDist;
  const pos = [d*Math.cos(el)*Math.sin(az), d*Math.sin(el), d*Math.cos(el)*Math.cos(az)];
  const L = Math.hypot(...pos);
  const fwd = pos.map(v => -v/L);
  let rx = fwd[1]*0 - fwd[2]*1, ry = fwd[2]*0 - fwd[0]*0, rz = fwd[0]*1 - fwd[1]*0;
  const rl = Math.hypot(rx, ry, rz); rx/=rl; ry/=rl; rz/=rl;
  const up = [
    ry*fwd[2] - rz*fwd[1],
    rz*fwd[0] - rx*fwd[2],
    rx*fwd[1] - ry*fwd[0],
  ];
  return { pos, fwd, right:[rx, ry, rz], up, tanHalf: CONFIG.view.fitHalfHeight/d };
})();

let renderW = 0, renderH = 0, aspect = 1;

// 描画の重さに合わせて解像度を上下させる。
// レイマーチは画素数にそのまま比例するので、ここが一番効く。
const Quality = {
  scale: 1.0, min: 0.5, max: 1.0,
  acc: 0, n: 0, hold: 1.2,
  update(dt, ms){
    this.acc += ms; this.n++;
    this.hold -= dt;
    if (this.n < 30 || this.hold > 0) return;
    const avg = this.acc/this.n;
    this.acc = 0; this.n = 0;
    if (avg > 23 && this.scale > this.min) {
      this.scale = Math.max(this.min, this.scale - 0.12);
      this.hold = 1.5; resize();
    } else if (avg < 13.5 && this.scale < this.max) {
      this.scale = Math.min(this.max, this.scale + 0.06);
      this.hold = 3.0; resize();
    }
  },
};

function resize(){
  const cssW = Math.max(1, Math.round(canvas.clientWidth  || innerWidth));
  const cssH = Math.max(1, Math.round(canvas.clientHeight || innerHeight));
  const dpr  = Math.min(devicePixelRatio || 1, CONFIG.view.maxDpr)*Quality.scale;
  const MAXPIX = 2.6e6;
  let w = Math.round(cssW*dpr), h = Math.round(cssH*dpr);
  if (w*h > MAXPIX) {
    const k = Math.sqrt(MAXPIX/(w*h));
    w = Math.max(1, Math.round(w*k));
    h = Math.max(1, Math.round(h*k));
  }
  if (w === renderW && h === renderH) return;
  renderW = w; renderH = h; aspect = w/h;
  canvas.width = w; canvas.height = h;
  if (Gpu.ok) Gpu.resize(w, h);
}

function writeUniforms(time){
  const U = Gpu.ubData;
  const R = CAM.right, Up = CAM.up, F = CAM.fwd, P = CAM.pos;
  const gUp = Gravity.up;
  const L = CONFIG.liquid, G = CONFIG.glass;

  // view（世界 -> ビュー、列優先）
  U[0]=R[0];  U[1]=Up[0]; U[2]=-F[0]; U[3]=0;
  U[4]=R[1];  U[5]=Up[1]; U[6]=-F[1]; U[7]=0;
  U[8]=R[2];  U[9]=Up[2]; U[10]=-F[2]; U[11]=0;
  U[12]=-(R[0]*P[0]+R[1]*P[1]+R[2]*P[2]);
  U[13]=-(Up[0]*P[0]+Up[1]*P[1]+Up[2]*P[2]);
  U[14]=  F[0]*P[0]+F[1]*P[1]+F[2]*P[2];
  U[15]=1;

  // proj（透視投影。z は 0..1）
  const near = 0.25, far = 24.0;
  const fy = 1/CAM.tanHalf;
  U[16]=fy/aspect; U[17]=0;  U[18]=0;                  U[19]=0;
  U[20]=0;         U[21]=fy; U[22]=0;                  U[23]=0;
  U[24]=0;         U[25]=0;  U[26]=far/(near-far);     U[27]=-1;
  U[28]=0;         U[29]=0;  U[30]=far*near/(near-far); U[31]=0;

  // viewProj = proj * view（列優先）
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += U[16 + k*4 + r]*U[c*4 + k];
      U[32 + c*4 + r] = v;
    }

  U[48]=R[0];  U[49]=R[1];  U[50]=R[2];  U[51]=CAM.tanHalf;
  U[52]=Up[0]; U[53]=Up[1]; U[54]=Up[2]; U[55]=aspect;
  U[56]=F[0];  U[57]=F[1];  U[58]=F[2];  U[59]=0;
  U[60]=P[0];  U[61]=P[1];  U[62]=P[2];  U[63]=time;
  U[64]=gUp[0]; U[65]=gUp[1]; U[66]=gUp[2]; U[67]=0;
  U[68]=L.color[0]; U[69]=L.color[1]; U[70]=L.color[2]; U[71]=L.absorb;
  U[72]=G.color[0]; U[73]=G.color[1]; U[74]=G.color[2]; U[75]=G.absorb;
  U[76]=G.ior; U[77]=L.ior; U[78]=G.roughness; U[79]=CONFIG.view.exposure;
  U[80]=renderW; U[81]=renderH; U[82]=1/renderW; U[83]=1/renderH;
  U[84]=SHAPE.bound.r; U[85]=SHAPE.bound.h;
  U[86]=CONFIG.env.mipCount - 1; U[87]=CONFIG.env.bgGain;

  // 流体の描画パラメータ
  const s  = Sim.spacing || 0.02;
  const pr = CONFIG.sim.drawRadius*s;
  const screenR = pr/(CONFIG.view.camDist*CAM.tanHalf)*(renderH*0.5);
  U[88]=pr;
  U[89]=3*s*s*s/(4*Math.PI*pr*pr*pr);
  U[90]=Math.max(2, Math.min(18, Math.round(screenR*2.2)));
  U[91]=FAR;

  Gpu.dev.queue.writeBuffer(Gpu.ub, 0, U);
}

const Perf = { t:0, n:0, fps:0, ms:0 };
let lastT = 0;

function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000) || 0.016;
  lastT = now;

  if (document.hidden) { requestAnimationFrame(frame); return; }
  Quality.update(dt, dt*1000);
  resize();
  Gravity.update(dt);
  Bubbles.readHistogram(Sim.hist, Sim.N, Sim.histExt);
  Bubbles.update(Math.min(dt, 1/30), Gravity.up, Gravity.down, Sim.N, Sim.spacing);
  Sim.writeBubbles(Gpu.dev, Bubbles.data);
  writeUniforms(now/1000);
  Gpu.render(Math.min(dt, 1/45), Gravity.down);

  Perf.t += dt; Perf.n++;
  if (Perf.t >= 0.5) {
    Perf.fps = Perf.n/Perf.t; Perf.ms = 1000*Perf.t/Perf.n;
    Perf.t = 0; Perf.n = 0;
    if (DEBUG) {
      const g = Gravity.down;
      hud.textContent =
        `fps ${Perf.fps.toFixed(1)}  (${Perf.ms.toFixed(2)} ms)\n` +
        `描画 ${renderW}x${renderH}  品質 ${Quality.scale.toFixed(2)}\n` +
        `粒子 ${Sim.N}  間隔 ${Sim.spacing.toFixed(4)}  h ${Sim.h.toFixed(4)}\n` +
        `格子 ${Sim.dims.join('x')} = ${Sim.cells}  ρ0 ${Sim.rho0.toFixed(1)}\n` +
        `泡 ${Bubbles.list.length}個  累計 ${Bubbles.spawned}  借り ${(Bubbles.airDebt*1e4).toFixed(2)}e-4\n` +
        `液面 ${Bubbles.surface.toFixed(3)}  上の粒子 ${Bubbles.upperN}\n` +
        `形状 ${CONFIG.shape}  環境 ${CONFIG.env.preset}\n` +
        `重力 ${g[0].toFixed(2)} ${g[1].toFixed(2)} ${g[2].toFixed(2)}\n` +
        `GPU ${Gpu.adapterInfo.vendor || '?'} / ${Gpu.adapterInfo.architecture || '?'}`;
    }
  }
  requestAnimationFrame(frame);
}

   UI — 隠しパネル（色と少しの調整）

const LIQUID_PRESETS = [
  { name:'ブルー',   c:[0.13, 0.50, 0.96] },
  { name:'シアン',   c:[0.08, 0.72, 0.80] },
  { name:'グリーン', c:[0.22, 0.76, 0.32] },
  { name:'ライム',   c:[0.62, 0.84, 0.14] },
  { name:'イエロー', c:[0.96, 0.78, 0.10] },
  { name:'アンバー', c:[0.97, 0.47, 0.08] },
  { name:'レッド',   c:[0.93, 0.15, 0.18] },
  { name:'パープル', c:[0.56, 0.22, 0.94] },
];

function hsv2rgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  const c = v*s, x = c*(1 - Math.abs((h/60)%2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h <  60)      { r=c; g=x; }
  else if (h < 120) { r=x; g=c; }
  else if (h < 180) { g=c; b=x; }
  else if (h < 240) { g=x; b=c; }
  else if (h < 300) { r=x; b=c; }
  else              { r=c; b=x; }
  return [r+m, g+m, b+m];
}
function rgb2hue(c){
  const mx = Math.max(...c), mn = Math.min(...c);
  if (mx - mn < 1e-6) return 210;
  let h;
  if (mx === c[0])      h = 60*(((c[1]-c[2])/(mx-mn))%6);
  else if (mx === c[1]) h = 60*((c[2]-c[0])/(mx-mn) + 2);
  else                  h = 60*((c[0]-c[1])/(mx-mn) + 4);
  return (h + 360)%360;
}
const css = (c) => '#' + c.map(v =>
  Math.round(Math.min(1, Math.max(0, Math.pow(v, 1/2.2)))*255).toString(16).padStart(2,'0')).join('');

const UI = (() => {
  const $ = (id) => document.getElementById(id);
  let panel, gear, dimTimer = null, isOpen = false;
  let st = {};

  const load = () => { try { return JSON.parse(localStorage.getItem('oozetube') || '{}'); } catch(_) { return {}; } };
  const save = () => { try { localStorage.setItem('oozetube', JSON.stringify(st)); } catch(_) {} };

  function applyColor(c){
    CONFIG.liquid.color = c.slice();
    for (const b of $('swatches').children) {
      b.setAttribute('aria-pressed', String(b.dataset.c === c.join(',')));
    }
    const h = Math.round(rgb2hue(c));
    $('sHue').value = h;
    $('vHue').textContent = h + '°';
    $('sHue').style.background =
      'linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)';
  }

  function setViscosity(v){
    CONFIG.sim.damping = v;
    CONFIG.sim.maxVel  = Math.max(0.18, Math.min(1.2, 3.0/v));
    $('vVis').textContent = v.toFixed(1);
  }

  function dimSoon(){
    gear.classList.remove('dim');
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => { if (!isOpen) gear.classList.add('dim'); }, 3500);
  }

  function toggle(on){
    isOpen = (on === undefined) ? !isOpen : on;
    panel.classList.toggle('open', isOpen);
    dimSoon();
  }

  function init(){
    panel = $('panel'); gear = $('gear');
    st = load();

    // --- 色のプリセット ---
    const sw = $('swatches');
    for (const p of LIQUID_PRESETS) {
      const b = document.createElement('button');
      b.style.background = css(p.c);
      b.title = p.name;
      b.dataset.c = p.c.join(',');
      b.onclick = () => { applyColor(p.c); st.color = p.c; save(); };
      sw.appendChild(b);
    }

    // --- 初期値 ---
    applyColor(st.color || CONFIG.liquid.color);
    CONFIG.liquid.absorb   = st.absorb   ?? CONFIG.liquid.absorb;
    CONFIG.bubble.airFactor= st.air      ?? CONFIG.bubble.airFactor;
    setViscosity(st.visc ?? CONFIG.sim.damping);
    $('sAbs').value = CONFIG.liquid.absorb;
    $('vAbs').textContent = CONFIG.liquid.absorb.toFixed(1);
    $('sVis').value = CONFIG.sim.damping;
    $('sBub').value = CONFIG.bubble.airFactor;
    $('vBub').textContent = CONFIG.bubble.airFactor.toFixed(2);
    if (st.env && ENV_PRESETS[st.env] !== undefined) CONFIG.env.preset = st.env;
    for (const b of $('segEnv').children) {
      b.setAttribute('aria-pressed', String(b.dataset.env === CONFIG.env.preset));
      b.onclick = () => {
        CONFIG.env.preset = b.dataset.env;
        st.env = b.dataset.env; save();
        Gpu.buildEnv(CONFIG.env.preset);
        for (const o of $('segEnv').children) o.setAttribute('aria-pressed', String(o === b));
      };
    }

    // --- スライダー ---
    $('sHue').oninput = (e) => {
      const c = hsv2rgb(+e.target.value, 0.88, 0.96);
      applyColor(c); st.color = c; save();
    };
    $('sAbs').oninput = (e) => {
      CONFIG.liquid.absorb = +e.target.value;
      $('vAbs').textContent = CONFIG.liquid.absorb.toFixed(1);
      st.absorb = CONFIG.liquid.absorb; save();
    };
    $('sVis').oninput = (e) => { setViscosity(+e.target.value); st.visc = +e.target.value; save(); };
    $('sBub').oninput = (e) => {
      CONFIG.bubble.airFactor = +e.target.value;
      $('vBub').textContent = CONFIG.bubble.airFactor.toFixed(2);
      st.air = CONFIG.bubble.airFactor; save();
    };

    // --- ボタン ---
    gear.onclick    = () => toggle();
    $('bFlip').onclick  = () => Gravity.flip();
    $('bReset').onclick = () => { Sim.reseed(Gpu.dev); Bubbles.reset(); };
    $('bSensor').onclick = async () => {
      const ok = await Gravity.enableSensors();
      $('bSensor').textContent = ok ? '傾きを使っています' : '傾きを使えませんでした';
      setTimeout(() => { $('bSensor').textContent = 'スマホの傾きを使う'; }, 2600);
    };

    // パネルの外を触ったら閉じる
    addEventListener('pointerdown', (e) => {
      if (!isOpen) return;
      if (e.target.closest && e.target.closest('#panel, #gear')) return;
      toggle(false);
    }, { passive:true });
    addEventListener('pointerdown', dimSoon, { passive:true });
    dimSoon();

    // --- センサーの許可 ---
    // iOS は利用者の操作がないと許可を求められないので、タッチ端末のときだけ
    // 起動時に一度だけ聞く。パソコンでは出さず、パネルのボタンから使える。
    const boot  = $('boot');
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && Gravity.needsPermission()) {
      boot.classList.add('show');
      $('bootOk').onclick = async () => {
        await Gravity.enableSensors();
        boot.classList.remove('show');
      };
    } else if (touch) {
      Gravity.enableSensors();
    }
  }

  return { init, toggle };
})();

(async () => {
  if (DEBUG) hud.hidden = false;
  try {
    resize();
    await Gpu.init(canvas);
    Gpu.resize(renderW, renderH);
    Bubbles.reset();
    UI.init();
    addEventListener('resize', resize);
    requestAnimationFrame((t) => { lastT = t; frame(t); });
  } catch (e) {
    showError(e.message || String(e), e.stack && e.message !== e.stack ? e.stack : '');
  }
})();

</script>
</body>
</html>
